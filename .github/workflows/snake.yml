name: Generate contribution snake

on:
  schedule:
    - cron: "30 18 * * *" # 00:00 IST every day
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: snake
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#DC2626&color_dots=#0A0806,#5a1414,#991B1B,#DC2626,#F5E6C8
            dist/github-contribution-grid-snake.svg?palette=github&color_snake=#DC2626&color_dots=#F5E6C8,#E8D4A2,#DC2626,#991B1B,#5a1414

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

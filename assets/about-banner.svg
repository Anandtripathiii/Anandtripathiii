<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="250" viewBox="0 0 1000 250" role="img" aria-label="About Anand">
<style>
  .mono { font-family: ui-monospace, Menlo, Consolas, monospace; }
  .sans { font-family: -apple-system, 'Segoe UI', Helvetica, sans-serif; }
  .pulse { animation: pulse 2.4s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity:.5; } 50% { opacity:1; } }
  @media (prefers-reduced-motion: reduce) { * { animation:none !important; } }
</style>
<defs>
  <linearGradient id="abg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#1a0a2e"/><stop offset="1" stop-color="#050308"/>
  </linearGradient>
  <linearGradient id="abrd" x1="0" x2="1">
    <stop offset="0" stop-color="#A855F7"/><stop offset=".5" stop-color="#E13838"/><stop offset="1" stop-color="#A855F7"/>
  </linearGradient>
  <radialGradient id="halo" cx="200" cy="125" r="200">
    <stop offset="0" stop-color="#A855F7" stop-opacity=".30"/>
    <stop offset="1" stop-color="#A855F7" stop-opacity="0"/>
  </radialGradient>
</defs>

<rect x="1" y="1" width="998" height="248" rx="14" fill="url(#abg)" stroke="url(#abrd)" stroke-width="2"/>
<rect x="1" y="1" width="998" height="248" rx="14" fill="url(#halo)"/>

<!-- Title -->
<text x="28" y="60" class="sans" font-size="28" font-weight="900" fill="#F8FAFC">Shipping AI products you can actually trust.</text>
<text x="28" y="94" class="sans" font-size="14" fill="#C084FC">B.Tech CSE at ADGIPS (GGSIPU). I design and deploy end-to-end AI systems — RAG pipelines,</text>
<text x="28" y="112" class="sans" font-size="14" fill="#C084FC">multi-LLM orchestration, hardened FastAPI / Flask backends with per-session isolation,</text>
<text x="28" y="130" class="sans" font-size="14" fill="#C084FC">rate limiting, and quote-verified answers against the source.</text>

<!-- Right side pill badges -->
<g transform="translate(640,32)" class="mono" font-size="11">
  <rect width="330" height="30" rx="8" fill="#140824" stroke="#4C1D95"/>
  <circle cx="18" cy="15" r="4" fill="#E13838" class="pulse"/>
  <text x="30" y="19" fill="#F8FAFC">CORE  <tspan fill="#7C3AED">· software · applied AI · full-stack</tspan></text>

  <g transform="translate(0,42)">
    <rect width="330" height="30" rx="8" fill="#140824" stroke="#4C1D95"/>
    <circle cx="18" cy="15" r="4" fill="#A855F7"/>
    <text x="30" y="19" fill="#F8FAFC">DNA   <tspan fill="#7C3AED">· reliability · prompt-eng · guardrails</tspan></text>
  </g>
  <g transform="translate(0,84)">
    <rect width="330" height="30" rx="8" fill="#140824" stroke="#4C1D95"/>
    <circle cx="18" cy="15" r="4" fill="#E13838"/>
    <text x="30" y="19" fill="#F8FAFC">OPEN  <tspan fill="#7C3AED">· SDE · AI / ML internships · OSS</tspan></text>
  </g>
  <g transform="translate(0,126)">
    <rect width="330" height="30" rx="8" fill="#140824" stroke="#4C1D95"/>
    <circle cx="18" cy="15" r="4" fill="#C084FC"/>
    <text x="30" y="19" fill="#F8FAFC">BASE  <tspan fill="#7C3AED">· Delhi, India  ·  2024 – 2028</tspan></text>
  </g>
</g>

<!-- Bottom tagline -->
<rect x="28" y="196" width="420" height="2" fill="#4C1D95"/>
<text x="28" y="224" class="mono" font-size="10" letter-spacing="4" fill="#7C3AED">clean architecture · reproducible pipelines · software that survives real users</text>
</svg>

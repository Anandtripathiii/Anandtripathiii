<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="230" viewBox="0 0 1000 230" role="img" aria-label="About — Anand Tripathi, building production-grade AI systems and full-stack products.">
<style>
  .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
  .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }
  .pulse { animation: pulse 2.4s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: .5; } 50% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<defs>
  <linearGradient id="abg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#1a0a08"/><stop offset="1" stop-color="#0A0806"/>
  </linearGradient>
  <linearGradient id="abrd" x1="0" x2="1">
    <stop offset="0" stop-color="#DC2626"/><stop offset=".5" stop-color="#F5E6C8"/><stop offset="1" stop-color="#DC2626"/>
  </linearGradient>
  <radialGradient id="halo2" cx="200" cy="115" r="200">
    <stop offset="0" stop-color="#DC2626" stop-opacity=".30"/>
    <stop offset="1" stop-color="#DC2626" stop-opacity="0"/>
  </radialGradient>
</defs>

<rect x="1" y="1" width="998" height="228" rx="14" fill="url(#abg)" stroke="url(#abrd)" stroke-width="1.4"/>
<rect x="1" y="1" width="998" height="228" rx="14" fill="url(#halo2)"/>

<!-- Section tag -->
<g transform="translate(28,30)">
  <rect y="4" width="12" height="22" fill="#DC2626"/>
  <text x="22" y="20" class="mono" font-size="10" letter-spacing="4" fill="#8a7849">[ 01 ]  ABOUT</text>
</g>

<!-- Title -->
<text x="28" y="90" class="sans" font-size="28" font-weight="800" fill="#F5E6C8">
  <tspan>Shipping AI products you can actually trust.</tspan>
</text>
<text x="28" y="128" class="sans" font-size="14" fill="#C9B48A" style="letter-spacing:.3px">
  <tspan>B.Tech CSE at ADGIPS (GGSIPU). I design and deploy end-to-end AI systems — RAG pipelines,</tspan>
</text>
<text x="28" y="148" class="sans" font-size="14" fill="#C9B48A">
  <tspan>multi-LLM orchestration, hardened FastAPI / Flask backends with per-session isolation,</tspan>
</text>
<text x="28" y="168" class="sans" font-size="14" fill="#C9B48A">
  <tspan>rate limiting, and quote-verified answers against the source.</tspan>
</text>

<!-- Right side mini-badges -->
<g transform="translate(640,34)" class="mono" font-size="11">
  <rect width="330" height="30" rx="8" fill="#140807" stroke="#3f1515"/>
  <circle cx="18" cy="15" r="4" fill="#DC2626" class="pulse"/>
  <text x="30" y="19" fill="#F5E6C8">CORE  <tspan fill="#8a7849">· software · applied AI · full-stack</tspan></text>

  <g transform="translate(0,42)">
    <rect width="330" height="30" rx="8" fill="#140807" stroke="#3f1515"/>
    <circle cx="18" cy="15" r="4" fill="#F5E6C8"/>
    <text x="30" y="19" fill="#F5E6C8">DNA   <tspan fill="#8a7849">· reliability · prompt-eng · guardrails</tspan></text>
  </g>
  <g transform="translate(0,84)">
    <rect width="330" height="30" rx="8" fill="#140807" stroke="#3f1515"/>
    <circle cx="18" cy="15" r="4" fill="#DC2626"/>
    <text x="30" y="19" fill="#F5E6C8">OPEN  <tspan fill="#8a7849">· SDE · AI / ML internships · OSS</tspan></text>
  </g>
  <g transform="translate(0,126)">
    <rect width="330" height="30" rx="8" fill="#140807" stroke="#3f1515"/>
    <circle cx="18" cy="15" r="4" fill="#C9B48A"/>
    <text x="30" y="19" fill="#F5E6C8">BASE  <tspan fill="#8a7849">· Delhi, India  ·  2024 – 2028</tspan></text>
  </g>
</g>

<!-- Small bottom caption -->
<text x="28" y="206" class="mono" font-size="10" letter-spacing="4" fill="#8a7849">clean architecture · reproducible pipelines · software that survives real users</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="280" viewBox="0 0 1000 280" role="img" aria-labelledby="at-title at-desc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="at-title">Anand Tripathi</title>
  <desc id="at-desc">Software Engineer, Applied AI/ML and Full-Stack Developer</desc>
  <defs>
    <linearGradient id="at-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0F14"/>
      <stop offset="1" stop-color="#161B22"/>
    </linearGradient>
    <linearGradient id="at-line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F87171" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#F87171"/>
      <stop offset="1" stop-color="#E5E7EB" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="at-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F87171" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#F87171" stop-opacity="0"/>
    </radialGradient>
    <pattern id="at-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#E5E7EB" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <filter id="at-blur" x="-20%" y="-200%" width="140%" height="500%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <rect width="1000" height="280" rx="14" fill="url(#at-bg)"/>
  <rect width="1000" height="280" rx="14" fill="url(#at-grid)"/>

  <!-- soft moving light -->
  <ellipse cx="780" cy="90" rx="260" ry="150" fill="url(#at-glow)">
    <animate attributeName="cx" values="700;860;700" dur="12s" repeatCount="indefinite"/>
  </ellipse>

  <!-- restrained orbital geometry -->
  <g fill="none" stroke="#E5E7EB" stroke-opacity="0.14" stroke-width="1">
    <circle cx="850" cy="140" r="96"/>
    <circle cx="850" cy="140" r="62" stroke="#F87171" stroke-opacity="0.35"/>
  </g>
  <g>
    <circle r="4" fill="#F87171" cx="946" cy="140">
      <animateTransform attributeName="transform" type="rotate" from="0 850 140" to="360 850 140" dur="18s" repeatCount="indefinite"/>
    </circle>
    <circle r="3" fill="#E5E7EB" cx="788" cy="140">
      <animateTransform attributeName="transform" type="rotate" from="360 850 140" to="0 850 140" dur="11s" repeatCount="indefinite"/>
    </circle>
    <circle cx="850" cy="140" r="6" fill="#F87171"/>
  </g>

  <!-- pipeline path: query -> retrieve -> verify -> answer -->
  <path id="at-path" d="M60 232 C 180 232, 200 196, 300 196 S 440 232, 560 214 S 700 178, 790 178"
        fill="none" stroke="url(#at-line)" stroke-width="2.5" stroke-linecap="round"
        stroke-dasharray="1000" stroke-dashoffset="0">
    <animate attributeName="stroke-dashoffset" values="1000;0;0" keyTimes="0;0.55;1" dur="9s" repeatCount="indefinite"/>
  </path>
  <g fill="#0B0F14" stroke="#F87171" stroke-width="2">
    <circle cx="60" cy="232" r="5"/>
    <circle cx="300" cy="196" r="5"/>
    <circle cx="560" cy="214" r="5"/>
    <circle cx="790" cy="178" r="5"/>
  </g>
  <circle r="4.5" fill="#E5E7EB">
    <animateMotion dur="9s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;0.55;1" calcMode="linear">
      <mpath href="#at-path"/>
    </animateMotion>
    <animate attributeName="opacity" values="1;1;0" keyTimes="0;0.55;0.6" dur="9s" repeatCount="indefinite"/>
  </circle>

  <!-- text -->
  <text x="60" y="108" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="58" font-weight="700" fill="#E5E7EB" letter-spacing="-1">Anand Tripathi</text>
  <text x="62" y="146" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#F87171">Software Engineer, Applied AI/ML and Full-Stack Developer</text>

  <!-- glowing underline -->
  <rect x="62" y="160" width="300" height="4" rx="2" fill="#F87171" opacity="0.7" filter="url(#at-blur)">
    <animate attributeName="width" values="120;300;120" dur="6s" repeatCount="indefinite"/>
  </rect>
  <rect x="62" y="160" width="300" height="3" rx="1.5" fill="#F87171">
    <animate attributeName="width" values="120;300;120" dur="6s" repeatCount="indefinite"/>
  </rect>
</svg>

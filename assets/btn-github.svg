<svg xmlns="http://www.w3.org/2000/svg" width="180" height="54" viewBox="0 0 180 54" role="img" aria-label="GitHub">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1a0a2e"/><stop offset="1" stop-color="#050308"/></linearGradient>
    <linearGradient id="brd" x1="0" x2="1"><stop offset="0" stop-color="#E13838"/><stop offset="1" stop-color="#A855F7"/></linearGradient>
  </defs>
  <rect x="1" y="1" width="178" height="52" rx="12" fill="url(#bg)" stroke="url(#brd)" stroke-width="2"/>
  <!-- pixel squares that read as a "GH" mark -->
  <g transform="translate(20,15)" fill="#F8FAFC">
    <rect x="0"  y="0"  width="4" height="4"/><rect x="4"  y="0"  width="4" height="4"/><rect x="8"  y="0"  width="4" height="4"/>
    <rect x="0"  y="4"  width="4" height="16"/>
    <rect x="0"  y="20" width="4" height="4"/><rect x="4"  y="20" width="4" height="4"/><rect x="8"  y="20" width="4" height="4"/>
    <rect x="8"  y="12" width="4" height="4" fill="#A855F7"/>
    <rect x="8"  y="16" width="4" height="4"/>
    <rect x="16" y="0"  width="4" height="24"/>
    <rect x="20" y="10" width="4" height="4"/>
    <rect x="24" y="0"  width="4" height="24"/>
  </g>
  <text x="60" y="34" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14" font-weight="800" letter-spacing="3" fill="#F8FAFC">GITHUB</text>
</svg>

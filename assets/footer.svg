<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="180" viewBox="0 0 1000 180" role="img" aria-label="Thanks for stopping by. Let's build something that matters.">
<style>
  .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
  .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }
  .drift { animation: drift 20s linear infinite; }
  @keyframes drift { from { transform: translateX(0); } to { transform: translateX(-200px); } }
  .pulse { animation: pulse 2.4s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<defs>
  <linearGradient id="fbg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#0A0806"/>
    <stop offset="1" stop-color="#2a0f0c"/>
  </linearGradient>
  <linearGradient id="fbrd" x1="0" x2="1">
    <stop offset="0" stop-color="#DC2626"/><stop offset=".5" stop-color="#F5E6C8"/><stop offset="1" stop-color="#DC2626"/>
  </linearGradient>
  <linearGradient id="wave" x1="0" x2="1">
    <stop offset="0" stop-color="#DC2626" stop-opacity=".0"/>
    <stop offset=".5" stop-color="#DC2626" stop-opacity=".55"/>
    <stop offset="1" stop-color="#DC2626" stop-opacity=".0"/>
  </linearGradient>
</defs>

<rect x="1" y="1" width="998" height="178" rx="14" fill="url(#fbg)" stroke="url(#fbrd)" stroke-width="1.4"/>

<!-- Wave band -->
<g class="drift">
  <path d="M -200 110 Q 50 80 300 110 T 800 110 T 1300 110 T 1800 110" fill="none" stroke="url(#wave)" stroke-width="2"/>
  <path d="M -200 130 Q 50 100 300 130 T 800 130 T 1300 130 T 1800 130" fill="none" stroke="#F5E6C8" stroke-opacity=".25" stroke-width="1.4"/>
</g>

<!-- Center text -->
<text x="500" y="60" text-anchor="middle" class="mono" font-size="12" letter-spacing="8" fill="#8a7849">THANKS FOR STOPPING BY</text>
<text x="500" y="98" text-anchor="middle" class="sans" font-size="22" font-weight="700" fill="#F5E6C8">Let's build something that matters.</text>

<!-- Signature -->
<g transform="translate(500,142)" class="mono">
  <circle cx="-110" cy="-4" r="4" fill="#DC2626" class="pulse"/>
  <text text-anchor="middle" font-size="11" letter-spacing="4" fill="#C9B48A">— ANAND TRIPATHI —</text>
  <circle cx="110" cy="-4" r="4" fill="#DC2626" class="pulse"/>
</g>
</svg>

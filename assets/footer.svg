<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="180" viewBox="0 0 1000 180" role="img" aria-label="Thanks for stopping by — let's build something that matters">
<style>
  .mono { font-family: ui-monospace, Menlo, Consolas, monospace; }
  .sans { font-family: -apple-system, 'Segoe UI', Helvetica, sans-serif; }
  .drift { animation: drift 20s linear infinite; }
  @keyframes drift { from { transform:translateX(0); } to { transform:translateX(-200px); } }
  .pulse { animation: pulse 2s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity:.4; } 50% { opacity:1; } }
  @media (prefers-reduced-motion: reduce) { * { animation:none !important; } }
</style>
<defs>
  <linearGradient id="fbg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#050308"/><stop offset="1" stop-color="#2a0a44"/></linearGradient>
  <linearGradient id="fbrd" x1="0" x2="1"><stop offset="0" stop-color="#A855F7"/><stop offset=".5" stop-color="#E13838"/><stop offset="1" stop-color="#A855F7"/></linearGradient>
  <linearGradient id="wave" x1="0" x2="1">
    <stop offset="0" stop-color="#A855F7" stop-opacity="0"/>
    <stop offset=".5" stop-color="#A855F7" stop-opacity=".6"/>
    <stop offset="1" stop-color="#A855F7" stop-opacity="0"/>
  </linearGradient>
</defs>

<rect x="1" y="1" width="998" height="178" rx="14" fill="url(#fbg)" stroke="url(#fbrd)" stroke-width="2"/>

<g class="drift">
  <path d="M -200 110 Q 50 80 300 110 T 800 110 T 1300 110 T 1800 110" fill="none" stroke="url(#wave)" stroke-width="2"/>
  <path d="M -200 130 Q 50 100 300 130 T 800 130 T 1300 130 T 1800 130" fill="none" stroke="#E13838" stroke-opacity=".35" stroke-width="1.4"/>
</g>

<text x="500" y="60" text-anchor="middle" class="mono" font-size="12" letter-spacing="8" fill="#7C3AED">THANKS FOR STOPPING BY</text>
<text x="500" y="98" text-anchor="middle" class="sans" font-size="22" font-weight="800" fill="#F8FAFC">Let's build something that matters.</text>

<g transform="translate(500,142)" class="mono">
  <circle cx="-130" cy="-4" r="4" fill="#E13838" class="pulse"/>
  <text text-anchor="middle" font-size="11" letter-spacing="4" fill="#C084FC">— ANAND TRIPATHI · PIXEL EDITION —</text>
  <circle cx="130" cy="-4" r="4" fill="#A855F7" class="pulse"/>
</g>
</svg>

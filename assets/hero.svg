<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" fill="none" role="img" aria-labelledby="heroTitle">
<title id="heroTitle">Anand Tripathi — Software Engineer, AI/ML Engineer, Full-Stack Developer.</title>
<style>
  .sans { font-family: -apple-system, 'Segoe UI', Helvetica, sans-serif; }
  .mono { font-family: ui-monospace, Menlo, Consolas, monospace; }
  .in { animation: fadein .8s cubic-bezier(.2,.8,.2,1) both; }
  .blink { animation: blink 1s steps(1) infinite; }
  .pulse { animation: pulse 2.4s ease-in-out infinite; }
  .ping { animation: ping 2.2s cubic-bezier(0,0,.2,1) infinite; transform-box: fill-box; transform-origin: center; }
  .bob { animation: bob 6s ease-in-out infinite; }
  .twinkle { animation: tw 3s ease-in-out infinite; }
  .rise { animation: rise .9s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes fadein { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:none; } }
  @keyframes rise   { from { opacity:0; transform:translateY(22px); } to { opacity:1; transform:none; } }
  @keyframes blink  { 50% { opacity: 0; } }
  @keyframes pulse  { 0%,100% { opacity: .4; } 50% { opacity: 1; } }
  @keyframes ping   { 0% { transform: scale(1); opacity: .7; } 80%,100% { transform: scale(3); opacity: 0; } }
  @keyframes bob    { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
  @keyframes tw     { 0%,100% { opacity: .15; } 50% { opacity: .9; } }
  .floor { animation: floor 3.2s cubic-bezier(.55,0,1,.45) infinite; }
  @keyframes floor { from { transform: translateY(0); opacity: 0; } 15% { opacity: .8; } to { transform: translateY(152px); opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<defs>
  <clipPath id="clip"><rect width="1000" height="470" rx="18"/></clipPath>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="5"/>
    <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>

  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#050308"/>
    <stop offset=".55" stop-color="#15082a"/>
    <stop offset="1" stop-color="#2a0f3a"/>
  </linearGradient>
  <radialGradient id="halo" cx="500" cy="318" r="460" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#A855F7" stop-opacity=".28"/>
    <stop offset=".5" stop-color="#E13838" stop-opacity=".08"/>
    <stop offset="1" stop-color="#A855F7" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#F5E6C8"/>
    <stop offset=".55" stop-color="#E13838"/>
    <stop offset="1" stop-color="#A855F7"/>
  </linearGradient>
  <mask id="sunmask">

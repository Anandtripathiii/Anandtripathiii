    <rect x="360" y="256" width="280" height="2.0" fill="#000"/>
    <rect x="360" y="269" width="280" height="3.3" fill="#000"/>
    <rect x="360" y="282" width="280" height="4.6" fill="#000"/>
    <rect x="360" y="295" width="280" height="5.9" fill="#000"/>
    <rect x="360" y="308" width="280" height="7.2" fill="#000"/>
  </mask>
  <linearGradient id="floorfade" x1="0" y1="318" x2="0" y2="470" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#fff" stop-opacity="0"/>
    <stop offset=".35" stop-color="#fff" stop-opacity=".7"/>
    <stop offset="1" stop-color="#fff" stop-opacity="1"/>
  </linearGradient>
  <mask id="floormask"><rect y="318" width="1000" height="152" fill="url(#floorfade)"/></mask>
  <linearGradient id="horizon" x1="0" x2="1">
    <stop offset="0" stop-color="#A855F7" stop-opacity="0"/>
    <stop offset=".3" stop-color="#A855F7"/>
    <stop offset=".7" stop-color="#E13838"/>
    <stop offset="1" stop-color="#E13838" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="name" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
    <stop offset="0" stop-color="#F8FAFC"/>
    <stop offset=".35" stop-color="#A855F7"/>
    <stop offset=".65" stop-color="#E13838"/>
    <stop offset="1" stop-color="#F8FAFC"/>
    <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;1 0" dur="6s" repeatCount="indefinite"/>
  </linearGradient>
</defs>


<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="340" viewBox="0 0 1000 340" fill="none" role="img" aria-labelledby="heroTitle">
<title id="heroTitle">Anand Tripathi — Software Engineer, AI/ML Engineer, Full-Stack Developer. Pixel edition.</title>
<style>
  .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
  .pix  { font-family: 'Press Start 2P', ui-monospace, Menlo, Consolas, monospace; }
  .in { animation: fadein .8s cubic-bezier(.2,.8,.2,1) both; }
  .blink { animation: blink 1s steps(1) infinite; }
  .pulse { animation: pulse 2s ease-in-out infinite; }
  .float { animation: float 4s ease-in-out infinite; }
  .float2 { animation: float 4.6s ease-in-out infinite; animation-delay:-1s; }
  .float3 { animation: float 5.2s ease-in-out infinite; animation-delay:-2s; }
  .twinkle { animation: tw 2.4s ease-in-out infinite; }
  @keyframes fadein { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:none; } }
  @keyframes blink  { 50% { opacity:0; } }
  @keyframes pulse  { 0%,100% { opacity:.5; } 50% { opacity:1; } }
  @keyframes float  { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-6px); } }
  @keyframes tw     { 0%,100% { opacity:.15; } 50% { opacity:.95; } }
  @media (prefers-reduced-motion: reduce) { * { animation:none !important; } }
</style>
<defs>
  <clipPath id="clip"><rect width="1000" height="340" rx="14"/></clipPath>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#050308"/>
    <stop offset="1" stop-color="#1a0a2e"/>
  </linearGradient>
  <radialGradient id="halo" cx="500" cy="200" r="500" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#A855F7" stop-opacity=".22"/>
    <stop offset=".5" stop-color="#E13838" stop-opacity=".08"/>
    <stop offset="1" stop-color="#A855F7" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="name" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
    <stop offset="0" stop-color="#F8FAFC"/>
    <stop offset=".3" stop-color="#C084FC"/>
    <stop offset=".55" stop-color="#A855F7"/>
    <stop offset=".8" stop-color="#E13838"/>
    <stop offset="1" stop-color="#F8FAFC"/>
    <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;1 0" dur="7s" repeatCount="indefinite"/>
  </linearGradient>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="4"/>
    <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="rglow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="3"/>
    <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
    <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#A855F7" stroke-opacity=".06" stroke-width="1"/>
  </pattern>
</defs>

<g clip-path="url(#clip)">

  <rect width="1000" height="340" fill="url(#sky)"/>
  <rect width="1000" height="340" fill="url(#grid)"/>
  <rect width="1000" height="340" fill="url(#halo)"/>

  <!-- Stars (purple + red + white) -->
  <g>
    <rect x="60"  y="40"  width="3" height="3" fill="#C084FC" class="twinkle" style="animation-delay:-.3s"/>
    <rect x="930" y="48"  width="3" height="3" fill="#C084FC" class="twinkle" style="animation-delay:-1.1s"/>
    <rect x="200" y="30"  width="2" height="2" fill="#F8FAFC" class="twinkle" style="animation-delay:-.9s"/>
    <rect x="820" y="22"  width="2" height="2" fill="#F8FAFC" class="twinkle" style="animation-delay:-.2s"/>
    <rect x="140" y="80"  width="3" height="3" fill="#E13838" class="twinkle" style="animation-delay:-1.9s"/>
    <rect x="870" y="90"  width="3" height="3" fill="#E13838" class="twinkle" style="animation-delay:-.6s"/>
    <rect x="310" y="55"  width="2" height="2" fill="#A855F7" class="twinkle" style="animation-delay:-2.2s"/>
    <rect x="690" y="60"  width="2" height="2" fill="#A855F7" class="twinkle" style="animation-delay:-.8s"/>
    <rect x="490" y="30"  width="2" height="2" fill="#F8FAFC" class="twinkle" style="animation-delay:-1.5s"/>
    <rect x="40"  y="110" width="2" height="2" fill="#C084FC" class="twinkle" style="animation-delay:-2.4s"/>
    <rect x="960" y="200" width="2" height="2" fill="#C084FC" class="twinkle" style="animation-delay:-.4s"/>
    <rect x="30"  y="260" width="3" height="3" fill="#A855F7" class="twinkle" style="animation-delay:-1.8s"/>
    <rect x="970" y="290" width="3" height="3" fill="#E13838" class="twinkle" style="animation-delay:-.7s"/>
  </g>

  <!-- Pixel diamond art on left -->
  <g transform="translate(80,170)" class="float">
    <g fill="#A855F7">
      <rect x="0"   y="-8"  width="8" height="8"/>
      <rect x="-8"  y="0"   width="8" height="8"/><rect x="8"  y="0"   width="8" height="8"/>
      <rect x="-16" y="8"   width="8" height="8"/><rect x="16" y="8"   width="8" height="8"/>
      <rect x="-8"  y="16"  width="8" height="8"/><rect x="8"  y="16"  width="8" height="8"/>
      <rect x="0"   y="24"  width="8" height="8"/>
    </g>
    <g fill="#E13838" opacity=".9">
      <rect x="-8" y="8" width="8" height="8"/><rect x="0" y="8" width="8" height="8"/><rect x="8" y="8" width="8" height="8"/>
    </g>
  </g>

  <!-- Pixel diamond art on right -->
  <g transform="translate(920,170)" class="float2">
    <g fill="#E13838">
      <rect x="0"   y="-8"  width="8" height="8"/>
      <rect x="-8"  y="0"   width="8" height="8"/><rect x="8"  y="0"   width="8" height="8"/>
      <rect x="-16" y="8"   width="8" height="8"/><rect x="16" y="8"   width="8" height="8"/>
      <rect x="-8"  y="16"  width="8" height="8"/><rect x="8"  y="16"  width="8" height="8"/>
      <rect x="0"   y="24"  width="8" height="8"/>
    </g>
    <g fill="#A855F7" opacity=".95">
      <rect x="-8" y="8" width="8" height="8"/><rect x="0" y="8" width="8" height="8"/><rect x="8" y="8" width="8" height="8"/>
    </g>
  </g>

  <!-- Pixel music notes drifting -->
  <g transform="translate(160,120)" class="float3">
    <g fill="#C084FC">
      <rect x="0" y="0" width="4" height="4"/><rect x="0" y="4" width="4" height="4"/><rect x="0" y="8" width="4" height="4"/><rect x="0" y="12" width="4" height="4"/>
      <rect x="4" y="12" width="4" height="4"/><rect x="8" y="12" width="4" height="4"/>
      <rect x="4" y="-4" width="4" height="4"/><rect x="8" y="-4" width="4" height="4"/>
    </g>
  </g>
  <g transform="translate(820,230)" class="float">
    <g fill="#A855F7">
      <rect x="0" y="0" width="4" height="4"/><rect x="0" y="4" width="4" height="4"/><rect x="0" y="8" width="4" height="4"/><rect x="0" y="12" width="4" height="4"/>
      <rect x="4" y="12" width="4" height="4"/><rect x="8" y="12" width="4" height="4"/>
    </g>
  </g>

  <!-- Top status strip -->
  <g class="in" transform="translate(0,0)">
    <rect x="20" y="20" width="12" height="12" fill="#E13838" class="pulse"/>
    <text x="42" y="31" class="mono" font-size="12" letter-spacing="3" fill="#C084FC">SYS://ANAND.EXE</text>
    <text x="980" y="31" text-anchor="end" class="mono" font-size="12" letter-spacing="3" fill="#C084FC">LVL <tspan fill="#F8FAFC">99</tspan> · <tspan fill="#E13838">BUILDING</tspan></text>
  </g>

  <!-- Center "PRESS START" line -->
  <g class="in" style="animation-delay:.1s">
    <text x="500" y="90" text-anchor="middle" class="mono" font-size="13" letter-spacing="10" fill="#C084FC">— HELLO, WORLD —</text>
  </g>

  <!-- Name — big block with gradient + chunky pixel shadow -->
  <g class="in" style="animation-delay:.2s">
    <!-- pixel shadow -->
    <text x="508" y="178" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, sans-serif" font-size="76" font-weight="900" letter-spacing="4" fill="#4C1D95" opacity=".9">ANAND TRIPATHI</text>
    <text x="500" y="170" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, sans-serif" font-size="76" font-weight="900" letter-spacing="4" fill="#A855F7" opacity=".55" filter="url(#glow)">ANAND TRIPATHI</text>
    <text x="500" y="170" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, sans-serif" font-size="76" font-weight="900" letter-spacing="4" fill="url(#name)">ANAND TRIPATHI</text>
  </g>

  <!-- Terminal-like tagline rotator -->
  <g class="in" style="animation-delay:.4s">
    <rect x="200" y="210" width="600" height="48" rx="8" fill="#0A0612" fill-opacity=".85" stroke="#4C1D95"/>
    <text x="218" y="241" class="mono" font-size="20" fill="#E13838">&gt;</text>
    <g>
      <text x="246" y="241" class="mono" font-size="18" fill="#F8FAFC">
        <tspan>Software Engineer · AI / ML Engineer · Full-Stack</tspan>
        <animate attributeName="opacity" values="1;1;0;0;0;0;0;0;1" keyTimes="0;0.28;0.33;0.34;0.66;0.67;0.99;1;1" dur="12s" repeatCount="indefinite"/>
      </text>
      <text x="246" y="241" class="mono" font-size="18" fill="#F8FAFC" opacity="0">
        <tspan>RAG pipelines · multi-LLM · hardened backends.</tspan>
        <animate attributeName="opacity" values="0;0;1;1;0;0;0;0;0" keyTimes="0;0.33;0.34;0.66;0.67;0.99;1;1;1" dur="12s" repeatCount="indefinite"/>
      </text>
      <text x="246" y="241" class="mono" font-size="18" fill="#F8FAFC" opacity="0">
        <tspan>Shipping products you can actually trust.</tspan>
        <animate attributeName="opacity" values="0;0;0;0;1;1;0;0;0" keyTimes="0;0.33;0.34;0.66;0.67;0.99;1;1;1" dur="12s" repeatCount="indefinite"/>
      </text>
    </g>
    <rect x="760" y="222" width="10" height="24" fill="#A855F7" class="blink"/>
  </g>

  <!-- Bottom controller-style tags -->
  <g class="in" style="animation-delay:.6s">
    <g transform="translate(140,290)">
      <rect width="150" height="26" rx="13" fill="#4C1D95"/>
      <text x="75" y="18" text-anchor="middle" class="mono" font-size="10" letter-spacing="2" fill="#F8FAFC">DELHI · INDIA</text>
    </g>
    <g transform="translate(300,290)">
      <rect width="200" height="26" rx="13" fill="#1a0a2e" stroke="#A855F7"/>
      <text x="100" y="18" text-anchor="middle" class="mono" font-size="10" letter-spacing="2" fill="#C084FC">B.TECH CSE · ADGIPS '28</text>
    </g>
    <g transform="translate(510,290)">
      <rect width="180" height="26" rx="13" fill="#1a0a2e" stroke="#E13838"/>
      <text x="90" y="18" text-anchor="middle" class="mono" font-size="10" letter-spacing="2" fill="#E13838">OPEN TO SDE · AI/ML</text>
    </g>
    <g transform="translate(700,290)">
      <rect width="160" height="26" rx="13" fill="#4C1D95"/>
      <text x="80" y="18" text-anchor="middle" class="mono" font-size="10" letter-spacing="2" fill="#F8FAFC">BUILDING · SHIPPING</text>
    </g>
  </g>

</g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" role="img" aria-labelledby="pixTitle">
<title id="pixTitle">Pixel Avatar — pixel-art character of Anand with cycling eye expressions and extra moods.</title>
<style>
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  @keyframes cyc4 { 0%,24% { opacity:1; } 25%,100% { opacity:0; } }
  .eA { animation: cyc4 8s infinite; }
  .eB { animation: cyc4 8s infinite; animation-delay: -6s; }
  .eC { animation: cyc4 8s infinite; animation-delay: -4s; }
  .eD { animation: cyc4 8s infinite; animation-delay: -2s; }
  @keyframes cyc3 { 0%,32% { opacity:1; } 33%,100% { opacity:0; } }
  .mA { animation: cyc3 6s infinite; }
  .mB { animation: cyc3 6s infinite; animation-delay: -4s; }
  .mC { animation: cyc3 6s infinite; animation-delay: -2s; }
  .glow { animation: glow 2.4s ease-in-out infinite; }
  @keyframes glow { 0%,100% { opacity:.45; } 50% { opacity:1; } }
  .float { animation: float 3s ease-in-out infinite; }
  @keyframes float { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-4px); } }
  .pulse { animation: pulse 1.8s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity:.55; } 50% { opacity:1; } }
  @media (prefers-reduced-motion: reduce) { * { animation:none !important; } }
</style>
<defs>
  <linearGradient id="pbg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#0A0612"/>
    <stop offset="1" stop-color="#050308"/>
  </linearGradient>
  <linearGradient id="pbrd" x1="0" x2="1">
    <stop offset="0" stop-color="#A855F7"/><stop offset=".5" stop-color="#E13838"/><stop offset="1" stop-color="#A855F7"/>
  </linearGradient>
  <radialGradient id="purpleHalo" cx="200" cy="260" r="200" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#A855F7" stop-opacity=".32"/>
    <stop offset="1" stop-color="#A855F7" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="redHalo" cx="200" cy="260" r="130" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#E13838" stop-opacity=".4"/>
    <stop offset="1" stop-color="#E13838" stop-opacity="0"/>
  </radialGradient>

  <!-- =============================================================== -->
  <!-- AVATAR BODY — one <g> drawn in native pixel coordinates (0..210 x 0..216) -->
  <!-- Use with: <use href="#body" transform="translate(x,y) scale(s)"/> -->
  <!-- Each sub-piece is also a <g id> so we can mix eyes/mouth variants per cell -->
  <!-- =============================================================== -->

  <g id="hair">
    <!-- hair base: dark warm black with slight purple tint, visible against bg -->
    <g fill="#241428">
      <rect x="36" y="12" width="24" height="6"/>
      <rect x="60" y="6"  width="30" height="6"/>
      <rect x="90" y="0"  width="36" height="6"/>
      <rect x="126" y="6" width="30" height="6"/>
      <rect x="156" y="12" width="24" height="6"/>
      <rect x="30" y="18" width="156" height="30"/>
      <rect x="24" y="24" width="168" height="24"/>
      <rect x="24" y="48" width="18" height="30"/>
      <rect x="174" y="48" width="18" height="30"/>
    </g>
    <!-- lighter purple edges / highlights -->
    <g fill="#7C3AED">
      <rect x="42" y="18" width="12" height="4"/>
      <rect x="78" y="12" width="12" height="4"/>
      <rect x="126" y="12" width="12" height="4"/>
      <rect x="162" y="18" width="12" height="4"/>
      <rect x="30" y="30" width="4" height="12"/>
      <rect x="184" y="30" width="4" height="12"/>
    </g>
    <!-- bright purple shine -->
    <g fill="#A855F7" opacity=".75">
      <rect x="96" y="6"  width="8" height="4"/>
      <rect x="108" y="6" width="8" height="4"/>
    </g>
  </g>

  <g id="headphones">
    <g fill="#E13838">
      <rect x="48" y="12" width="12" height="6"/>
      <rect x="60" y="6"  width="96" height="6"/>
      <rect x="156" y="12" width="12" height="6"/>
      <rect x="42" y="18" width="12" height="6"/>
      <rect x="162" y="18" width="12" height="6"/>
      <rect x="18" y="60" width="24" height="42"/>
      <rect x="12" y="66" width="30" height="30"/>
      <rect x="168" y="60" width="24" height="42"/>
      <rect x="168" y="66" width="30" height="30"/>
    </g>
    <g fill="#0A0612">
      <rect x="24" y="72" width="12" height="18"/>
      <rect x="174" y="72" width="12" height="18"/>
    </g>
    <g fill="#FB7185">
      <rect x="60" y="6"  width="12" height="3"/>
      <rect x="90" y="6"  width="12" height="3"/>
      <rect x="18" y="60" width="6" height="12"/>
      <rect x="168" y="60" width="6" height="12"/>
    </g>
  </g>

  <g id="face">
    <g fill="#B07655">
      <rect x="54" y="54" width="108" height="60"/>
      <rect x="48" y="60" width="120" height="48"/>
      <rect x="60" y="48" width="96" height="12"/>
      <rect x="84" y="114" width="48" height="18"/>
    </g>
    <g fill="#8B5A3C">
      <rect x="150" y="60" width="12" height="48"/>
      <rect x="54" y="108" width="108" height="6"/>
      <rect x="84" y="126" width="48" height="6"/>
      <rect x="102" y="84" width="12" height="6"/>
      <rect x="102" y="78" width="6" height="6"/>
    </g>
  </g>

  <g id="hoodie">
    <g fill="#1a1030">
      <rect x="24" y="132" width="168" height="78"/>
      <rect x="6" y="150" width="18" height="60"/>
      <rect x="192" y="150" width="18" height="60"/>
    </g>
    <g fill="#2b1a44">
      <rect x="18" y="138" width="6" height="72"/>
      <rect x="192" y="138" width="6" height="72"/>
      <rect x="24" y="132" width="168" height="6"/>
    </g>
    <g fill="#4C1D95">
      <rect x="96" y="132" width="24" height="12"/>
      <rect x="90" y="138" width="6" height="12"/>
      <rect x="120" y="138" width="6" height="12"/>
    </g>
    <g fill="#A855F7">
      <rect x="90" y="150" width="4" height="24"/>
      <rect x="122" y="150" width="4" height="24"/>
      <rect x="88" y="170" width="8" height="6"/>
      <rect x="120" y="170" width="8" height="6"/>
    </g>
    <g fill="#0a0612">
      <rect x="60" y="174" width="96" height="24"/>
    </g>
  </g>

  <!-- Body (hair + headphones + face + hoodie) WITHOUT eyes/mouth -->
  <g id="body">
    <use href="#hair"/>
    <use href="#headphones"/>
    <use href="#face"/>
    <use href="#hoodie"/>
  </g>

  <!-- Mouth variants -->
  <g id="mouthNormal"><rect x="102" y="96" width="12" height="4" fill="#4C1D95"/></g>
  <g id="mouthSmile">
    <rect x="96"  y="96" width="4" height="4" fill="#4C1D95"/>
    <rect x="100" y="100" width="20" height="4" fill="#4C1D95"/>
    <rect x="120" y="96" width="4" height="4" fill="#4C1D95"/>
  </g>
  <g id="mouthOpen">
    <rect x="98" y="94" width="24" height="12" fill="#1A1030"/>
    <rect x="98" y="94" width="24" height="4" fill="#4C1D95"/>
  </g>
  <g id="mouthFrown">
    <rect x="96" y="104" width="4" height="4" fill="#4C1D95"/>
    <rect x="100" y="100" width="20" height="4" fill="#4C1D95"/>
    <rect x="120" y="104" width="4" height="4" fill="#4C1D95"/>
  </g>
  <g id="mouthSleepy"><rect x="104" y="100" width="12" height="2" fill="#4C1D95"/></g>
  <g id="mouthSmirk">
    <rect x="100" y="100" width="20" height="4" fill="#4C1D95"/>
    <rect x="120" y="96" width="4" height="4" fill="#4C1D95"/>
  </g>

  <!-- Eye variants -->
  <g id="eyesNormal">
    <rect x="72" y="78" width="18" height="12" fill="#F8FAFC"/>
    <rect x="126" y="78" width="18" height="12" fill="#F8FAFC"/>
    <rect x="78" y="82" width="6" height="6" fill="#0A0612"/>
    <rect x="132" y="82" width="6" height="6" fill="#0A0612"/>
  </g>
  <g id="eyesLeft">
    <rect x="72" y="78" width="18" height="12" fill="#F8FAFC"/>
    <rect x="126" y="78" width="18" height="12" fill="#F8FAFC"/>
    <rect x="72" y="82" width="6" height="6" fill="#0A0612"/>
    <rect x="126" y="82" width="6" height="6" fill="#0A0612"/>
  </g>
  <g id="eyesRight">
    <rect x="72" y="78" width="18" height="12" fill="#F8FAFC"/>
    <rect x="126" y="78" width="18" height="12" fill="#F8FAFC"/>
    <rect x="84" y="82" width="6" height="6" fill="#0A0612"/>
    <rect x="138" y="82" width="6" height="6" fill="#0A0612"/>
  </g>
  <g id="eyesUp">
    <rect x="72" y="78" width="18" height="12" fill="#F8FAFC"/>
    <rect x="126" y="78" width="18" height="12" fill="#F8FAFC"/>
    <rect x="78" y="78" width="6" height="6" fill="#0A0612"/>
    <rect x="132" y="78" width="6" height="6" fill="#0A0612"/>
  </g>
  <g id="eyesClosed">
    <rect x="72" y="84" width="18" height="3" fill="#0A0612"/>
    <rect x="126" y="84" width="18" height="3" fill="#0A0612"/>
  </g>
  <g id="eyesWink">
    <rect x="72" y="78" width="18" height="12" fill="#F8FAFC"/>
    <rect x="78" y="82" width="6" height="6" fill="#0A0612"/>
    <rect x="126" y="84" width="18" height="3" fill="#0A0612"/>
  </g>
  <g id="eyesWide">
    <rect x="68" y="74" width="22" height="18" fill="#F8FAFC"/>
    <rect x="124" y="74" width="22" height="18" fill="#F8FAFC"/>
    <rect x="76" y="80" width="6" height="6" fill="#0A0612"/>
    <rect x="132" y="80" width="6" height="6" fill="#0A0612"/>
  </g>
  <g id="eyesHappy">
    <path d="M70 88 Q81 76 92 88" stroke="#0A0612" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M124 88 Q135 76 146 88" stroke="#0A0612" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>
  <g id="eyesAngry">
    <rect x="72" y="78" width="18" height="12" fill="#F8FAFC"/>
    <rect x="126" y="78" width="18" height="12" fill="#F8FAFC"/>
    <rect x="78" y="82" width="6" height="6" fill="#0A0612"/>
    <rect x="132" y="82" width="6" height="6" fill="#0A0612"/>
    <rect x="68" y="72" width="24" height="4" fill="#0A0612"/>
    <rect x="124" y="72" width="24" height="4" fill="#0A0612"/>
  </g>
  <g id="eyesCool">
    <rect x="66" y="76" width="30" height="14" fill="#0A0612"/>
    <rect x="120" y="76" width="30" height="14" fill="#0A0612"/>
    <rect x="94" y="80" width="28" height="4" fill="#0A0612"/>
    <rect x="74" y="78" width="4" height="4" fill="#A855F7"/>
    <rect x="128" y="78" width="4" height="4" fill="#A855F7"/>
  </g>
  <g id="eyesFocused">
    <rect x="72" y="80" width="18" height="8" fill="#F8FAFC"/>
    <rect x="126" y="80" width="18" height="8" fill="#F8FAFC"/>
    <rect x="80" y="82" width="4" height="4" fill="#E13838"/>
    <rect x="134" y="82" width="4" height="4" fill="#E13838"/>
  </g>
</defs>

<!-- PANEL FRAME -->
<rect x="4" y="4" width="992" height="632" rx="18" fill="url(#pbg)" stroke="url(#pbrd)" stroke-width="2"/>

<!-- Section tag -->
<g transform="translate(26,22)">
  <rect width="12" height="24" fill="#E13838"/>
  <text x="22" y="18" class="mono" font-size="10" letter-spacing="4" fill="#C084FC">[ 02 ]  PIXEL PANEL — CLICK AROUND MY HEAD</text>
</g>

<!-- MAIN AVATAR on the left: a frame + large pixel character -->
<g transform="translate(40,70)">
  <!-- halo -->
  <g transform="translate(-10,0)">
    <rect x="0" y="0" width="320" height="340" rx="12" fill="url(#purpleHalo)"/>
    <rect x="0" y="0" width="320" height="340" rx="12" fill="url(#redHalo)" class="glow"/>
  </g>
  <!-- frame -->
  <rect x="0" y="10" width="290" height="320" rx="12" fill="#050308" stroke="#4C1D95" stroke-width="2"/>
  <!-- corner marks -->
  <g fill="#A855F7">
    <rect x="8"   y="20"  width="12" height="2"/><rect x="8"   y="20"  width="2" height="12"/>
    <rect x="270" y="20"  width="12" height="2"/><rect x="280" y="20"  width="2" height="12"/>
    <rect x="8"   y="318" width="12" height="2"/><rect x="8"   y="308" width="2" height="12"/>
    <rect x="270" y="318" width="12" height="2"/><rect x="280" y="308" width="2" height="12"/>
  </g>

  <!-- Big avatar — 210px wide avatar scaled 1.2 → 252 wide. Centered at x=145 (frame center) → start x=19 -->
  <g transform="translate(19,46) scale(1.2)">
    <use href="#body"/>
    <g class="eA"><use href="#eyesNormal"/></g>
    <g class="eB"><use href="#eyesLeft"/></g>
    <g class="eC"><use href="#eyesRight"/></g>
    <g class="eD"><use href="#eyesUp"/></g>
    <g class="mA"><use href="#mouthSmile"/></g>
    <g class="mB"><use href="#mouthNormal"/></g>
    <g class="mC"><use href="#mouthSmirk"/></g>
  </g>

  <!-- floating pixel accents around frame -->
  <g class="float"><rect x="-8" y="60" width="8" height="8" fill="#A855F7"/></g>
  <g class="float" style="animation-delay:-1s"><rect x="286" y="120" width="8" height="8" fill="#E13838"/></g>
  <g class="float" style="animation-delay:-2s"><rect x="-6" y="220" width="6" height="6" fill="#C084FC"/></g>
  <g class="float" style="animation-delay:-1.5s"><rect x="286" y="250" width="6" height="6" fill="#A855F7"/></g>

  <!-- pixel music note top-left -->
  <g transform="translate(-14,20)">
    <g fill="#C084FC">
      <rect x="0" y="0" width="4" height="4"/><rect x="0" y="4" width="4" height="4"/><rect x="0" y="8" width="4" height="4"/><rect x="0" y="12" width="4" height="4"/>
      <rect x="4" y="12" width="4" height="4"/><rect x="8" y="12" width="4" height="4"/>
      <rect x="4" y="-4" width="4" height="4"/><rect x="8" y="-4" width="4" height="4"/>
    </g>
  </g>

  <!-- label -->
  <text x="145" y="356" text-anchor="middle" class="mono" font-size="11" letter-spacing="4" fill="#C084FC">· PIXEL AVATAR ·</text>
</g>

<!-- EYE EXPRESSIONS grid (right side top) -->
<g transform="translate(380,88)">
  <text x="285" y="-8" text-anchor="middle" class="mono" font-size="11" letter-spacing="4" fill="#A855F7">— EYE EXPRESSIONS —</text>

  <!-- Each cell: 140 wide × 130 tall. Avatar at scale .5 → 105 wide, centered -->
  <g class="mono" font-size="9">

    <g transform="translate(0,0)">
      <rect width="140" height="130" rx="8" fill="#0A0612" stroke="#4C1D95"/>
      <g transform="translate(18,8) scale(.5)"><use href="#body"/><use href="#eyesNormal"/><use href="#mouthNormal"/></g>
      <text x="70" y="122" text-anchor="middle" letter-spacing="2" fill="#A855F7">NORMAL</text>
    </g>
    <g transform="translate(148,0)">
      <rect width="140" height="130" rx="8" fill="#0A0612" stroke="#4C1D95"/>
      <g transform="translate(18,8) scale(.5)"><use href="#body"/><use href="#eyesLeft"/><use href="#mouthNormal"/></g>
      <text x="70" y="122" text-anchor="middle" letter-spacing="2" fill="#A855F7">LOOK LEFT</text>
    </g>
    <g transform="translate(296,0)">
      <rect width="140" height="130" rx="8" fill="#0A0612" stroke="#4C1D95"/>
      <g transform="translate(18,8) scale(.5)"><use href="#body"/><use href="#eyesRight"/><use href="#mouthNormal"/></g>
      <text x="70" y="122" text-anchor="middle" letter-spacing="2" fill="#A855F7">LOOK RIGHT</text>
    </g>
    <g transform="translate(444,0)">
      <rect width="140" height="130" rx="8" fill="#0A0612" stroke="#4C1D95"/>
      <g transform="translate(18,8) scale(.5)"><use href="#body"/><use href="#eyesUp"/><use href="#mouthNormal"/></g>
      <text x="70" y="122" text-anchor="middle" letter-spacing="2" fill="#A855F7">LOOK UP</text>
    </g>

    <!-- Row 2 -->
    <g transform="translate(0,140)">
      <rect width="140" height="130" rx="8" fill="#0A0612" stroke="#4C1D95"/>
      <g transform="translate(18,8) scale(.5)"><use href="#body"/><use href="#eyesClosed"/><use href="#mouthNormal"/></g>
      <text x="70" y="122" text-anchor="middle" letter-spacing="2" fill="#A855F7">BLINK</text>
    </g>
    <g transform="translate(148,140)">
      <rect width="140" height="130" rx="8" fill="#0A0612" stroke="#4C1D95"/>
      <g transform="translate(18,8) scale(.5)"><use href="#body"/><use href="#eyesWink"/><use href="#mouthSmirk"/></g>
      <text x="70" y="122" text-anchor="middle" letter-spacing="2" fill="#A855F7">WINK</text>
    </g>
    <g transform="translate(296,140)">
      <rect width="140" height="130" rx="8" fill="#0A0612" stroke="#4C1D95"/>
      <g transform="translate(18,8) scale(.5)"><use href="#body"/><use href="#eyesWide"/><use href="#mouthOpen"/></g>
      <text x="70" y="122" text-anchor="middle" letter-spacing="2" fill="#A855F7">WIDE EYES</text>
    </g>
    <g transform="translate(444,140)">
      <rect width="140" height="130" rx="8" fill="#0A0612" stroke="#4C1D95"/>
      <g transform="translate(18,8) scale(.5)"><use href="#body"/><use href="#eyesHappy"/><use href="#mouthSmile"/></g>
      <text x="70" y="122" text-anchor="middle" letter-spacing="2" fill="#A855F7">HAPPY EYES</text>
    </g>
  </g>
</g>

<!-- EXTRA MOODS strip (bottom row across full width) -->
<g transform="translate(40,440)">
  <text x="460" y="-8" text-anchor="middle" class="mono" font-size="11" letter-spacing="4" fill="#E13838">— EXTRA MOODS —</text>

  <!-- 7 columns of 132 wide -->
  <g class="mono" font-size="9">

    <g transform="translate(0,0)">
      <rect width="130" height="138" rx="8" fill="#0A0612" stroke="#4C1D95"/>
      <text x="118" y="14" text-anchor="end" font-size="12" fill="#E13838">♥</text>
      <g transform="translate(14,10) scale(.48)"><use href="#body"/><use href="#eyesHappy"/><use href="#mouthSmile"/></g>
      <text x="65" y="130" text-anchor="middle" letter-spacing="2" fill="#A855F7">SMILE</text>
    </g>
    <g transform="translate(138,0)">
      <rect width="130" height="138" rx="8" fill="#0A0612" stroke="#4C1D95"/>
      <text x="118" y="14" text-anchor="end" font-size="12" fill="#4C1D95">♥</text>
      <g transform="translate(14,10) scale(.48)"><use href="#body"/><use href="#eyesNormal"/><use href="#mouthFrown"/></g>
      <text x="65" y="130" text-anchor="middle" letter-spacing="2" fill="#A855F7">SAD</text>
    </g>
    <g transform="translate(276,0)">
      <rect width="130" height="138" rx="8" fill="#0A0612" stroke="#4C1D95"/>
      <text x="118" y="14" text-anchor="end" font-size="12" fill="#E13838">✦</text>
      <g transform="translate(14,10) scale(.48)"><use href="#body"/><use href="#eyesAngry"/><use href="#mouthFrown"/></g>
      <text x="65" y="130" text-anchor="middle" letter-spacing="2" fill="#A855F7">ANGRY</text>
    </g>
    <g transform="translate(414,0)">
      <rect width="130" height="138" rx="8" fill="#0A0612" stroke="#4C1D95"/>
      <text x="118" y="14" text-anchor="end" font-size="12" fill="#E13838">!</text>
      <g transform="translate(14,10) scale(.48)"><use href="#body"/><use href="#eyesWide"/><use href="#mouthOpen"/></g>
      <text x="65" y="130" text-anchor="middle" letter-spacing="2" fill="#A855F7">SURPRISED</text>
    </g>
    <g transform="translate(552,0)">
      <rect width="130" height="138" rx="8" fill="#0A0612" stroke="#4C1D95"/>
      <text x="118" y="14" text-anchor="end" font-size="10" fill="#C084FC">zZz</text>
      <g transform="translate(14,10) scale(.48)"><use href="#body"/><use href="#eyesClosed"/><use href="#mouthSleepy"/></g>
      <text x="65" y="130" text-anchor="middle" letter-spacing="2" fill="#A855F7">SLEEPY</text>
    </g>
    <g transform="translate(690,0)">
      <rect width="130" height="138" rx="8" fill="#0A0612" stroke="#4C1D95"/>
      <text x="118" y="14" text-anchor="end" font-size="12" fill="#A855F7">✧</text>
      <g transform="translate(14,10) scale(.48)"><use href="#body"/><use href="#eyesCool"/><use href="#mouthSmirk"/></g>
      <text x="65" y="130" text-anchor="middle" letter-spacing="2" fill="#A855F7">COOL</text>
    </g>
    <g transform="translate(828,0)">
      <rect width="130" height="138" rx="8" fill="#0A0612" stroke="#4C1D95"/>
      <text x="118" y="14" text-anchor="end" font-size="12" fill="#E13838">◎</text>
      <g transform="translate(14,10) scale(.48)"><use href="#body"/><use href="#eyesFocused"/><use href="#mouthNormal"/></g>
      <text x="65" y="130" text-anchor="middle" letter-spacing="2" fill="#A855F7">FOCUSED</text>
    </g>
  </g>
</g>

<!-- Bottom banner -->
<g transform="translate(500,610)">
  <rect x="-130" y="-18" width="260" height="24" rx="12" fill="#1a0a2e" stroke="#A855F7"/>
  <text y="-2" text-anchor="middle" class="mono" font-size="10" letter-spacing="4" fill="#A855F7">♥  MADE WITH PIXELS  ·  v1.0</text>
</g>

</svg>

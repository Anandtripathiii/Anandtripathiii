<svg xmlns="http://www.w3.org/2000/svg" width="490" height="280" viewBox="0 0 490 280" role="img" aria-label="ChargeEVSetu">
<style>
  .mono { font-family: ui-monospace, Menlo, Consolas, monospace; }
  .sans { font-family: -apple-system, 'Segoe UI', Helvetica, sans-serif; }
  .bolt { animation: bolt 1.6s ease-in-out infinite; }
  @keyframes bolt { 0%,100% { opacity:.3; } 50% { opacity:1; } }
  .ping { animation: ping 2.4s cubic-bezier(0,0,.2,1) infinite; transform-box:fill-box; transform-origin:center; }
  @keyframes ping { 0% { transform:scale(1); opacity:.6; } 80%,100% { transform:scale(2.4); opacity:0; } }
  @media (prefers-reduced-motion: reduce) { * { animation:none !important; } }
</style>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1a0a2e"/><stop offset="1" stop-color="#050308"/></linearGradient>
  <linearGradient id="brd" x1="0" x2="1"><stop offset="0" stop-color="#E13838"/><stop offset="1" stop-color="#A855F7"/></linearGradient>
</defs>
<rect x="1" y="1" width="488" height="278" rx="14" fill="url(#bg)" stroke="url(#brd)" stroke-width="2"/>

<g transform="translate(18,16)">
  <rect width="12" height="14" fill="#A855F7"/>
  <text x="22" y="12" class="mono" font-size="10" letter-spacing="3" fill="#C084FC">[ 06 ] · CHARGE-EV-SETU</text>
</g>
<g transform="translate(18,42)">
  <rect width="124" height="20" rx="4" fill="#991B1B"/>
  <text x="62" y="14" text-anchor="middle" class="mono" font-size="9" letter-spacing="1.6" fill="#F8FAFC">EV MAP INDIA</text>
  <rect x="150" width="150" height="20" rx="4" fill="#1a0a2e" stroke="#4C1D95"/>
  <text x="225" y="14" text-anchor="middle" class="mono" font-size="9" letter-spacing="1.6" fill="#A855F7">TECHFEST · IITB · PS1</text>
</g>

<text x="18" y="100" class="sans" font-size="24" font-weight="900" fill="#F8FAFC">ChargeEVSetu</text>
<text x="18" y="124" class="sans" font-size="12" fill="#C084FC">India's EV charging map, gap-analysis</text>
<text x="18" y="140" class="sans" font-size="12" fill="#C084FC">and planning lab — built for public use.</text>

<!-- India outline + charging pins -->
<g transform="translate(295,56)">
  <!-- rough India shape pixels -->
  <g fill="#1A1030" stroke="#4C1D95" stroke-width="1">
    <polygon points="80,0 110,10 130,30 140,60 130,90 110,120 95,135 85,120 70,110 60,90 55,70 50,50 55,30 65,15"/>
  </g>
  <!-- pins -->
  <g>
    <circle cx="85" cy="30" r="4" fill="#E13838"/>
    <circle cx="85" cy="30" r="4" fill="#E13838" class="ping"/>
  </g>
  <g>
    <circle cx="70" cy="60" r="4" fill="#A855F7"/>
    <circle cx="70" cy="60" r="4" fill="#A855F7" class="ping"/>
  </g>
  <g>
    <circle cx="105" cy="55" r="4" fill="#E13838"/>
    <circle cx="105" cy="55" r="4" fill="#E13838" class="ping"/>
  </g>
  <g>
    <circle cx="95" cy="90" r="4" fill="#C084FC"/>
    <circle cx="95" cy="90" r="4" fill="#C084FC" class="ping"/>
  </g>
  <g>
    <circle cx="80" cy="115" r="4" fill="#A855F7"/>
    <circle cx="80" cy="115" r="4" fill="#A855F7" class="ping"/>
  </g>
  <!-- bolt icon top right -->
  <g transform="translate(140,10)" class="bolt" fill="#E13838">
    <polygon points="8,0 0,14 6,14 2,24 14,10 8,10 12,0"/>
  </g>
</g>

<g transform="translate(18,186)">
  <text x="0" y="0" class="mono" font-size="10" letter-spacing="3" fill="#7C3AED">· METRICS ·</text>
  <g transform="translate(0,10)">
    <rect width="148" height="56" rx="8" fill="#140824" stroke="#4C1D95"/>
    <text x="10" y="22" class="mono" font-size="9" fill="#7C3AED">TEAM</text>
    <text x="10" y="42" class="mono" font-size="10" fill="#F8FAFC">Marlbros FC · leader</text>
  </g>
  <g transform="translate(156,10)">
    <rect width="150" height="56" rx="8" fill="#140824" stroke="#4C1D95"/>
    <text x="10" y="22" class="mono" font-size="9" fill="#7C3AED">V2 PAGES</text>
    <text x="10" y="42" class="mono" font-size="10" fill="#F8FAFC">7 public tools</text>
  </g>
  <g transform="translate(314,10)">
    <rect width="150" height="56" rx="8" fill="#140824" stroke="#4C1D95"/>
    <text x="10" y="22" class="mono" font-size="9" fill="#7C3AED">DEPLOY</text>
    <text x="10" y="42" class="mono" font-size="10" fill="#E13838">Vercel · live</text>
  </g>
</g>

<text x="472" y="265" text-anchor="end" class="mono" font-size="9" letter-spacing="3" fill="#4C1D95">github.com/Anandtripathiii/chargeevsetu</text>
</svg>

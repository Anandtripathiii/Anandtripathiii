<svg xmlns="http://www.w3.org/2000/svg" width="490" height="280" viewBox="0 0 490 280" role="img" aria-label="CodePilot AI">
<style>
  .mono { font-family: ui-monospace, Menlo, Consolas, monospace; }
  .sans { font-family: -apple-system, 'Segoe UI', Helvetica, sans-serif; }
  .blink { animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1a0a2e"/><stop offset="1" stop-color="#050308"/></linearGradient>
  <linearGradient id="brd" x1="0" x2="1"><stop offset="0" stop-color="#E13838"/><stop offset="1" stop-color="#A855F7"/></linearGradient>
</defs>
<rect x="1" y="1" width="488" height="278" rx="14" fill="url(#bg)" stroke="url(#brd)" stroke-width="2"/>

<g transform="translate(18,16)">
  <rect width="12" height="14" fill="#A855F7"/>
  <text x="22" y="12" class="mono" font-size="10" letter-spacing="3" fill="#C084FC">[ 02 ] · CODEPILOT-AI</text>
</g>
<g transform="translate(18,42)">
  <rect width="130" height="20" rx="4" fill="#991B1B"/>
  <text x="65" y="14" text-anchor="middle" class="mono" font-size="9" letter-spacing="1.6" fill="#F8FAFC">DUAL-LLM · FAISS</text>
  <rect x="138" width="120" height="20" rx="4" fill="#1a0a2e" stroke="#4C1D95"/>
  <text x="198" y="14" text-anchor="middle" class="mono" font-size="9" letter-spacing="1.6" fill="#A855F7">FLASK · RENDER</text>
</g>

<text x="18" y="100" class="sans" font-size="24" font-weight="900" fill="#F8FAFC">CodePilot AI</text>
<text x="18" y="124" class="sans" font-size="12" fill="#C084FC">A coding companion that orchestrates two</text>
<text x="18" y="140" class="sans" font-size="12" fill="#C084FC">LLMs over your files and live docs.</text>

<!-- Code editor on right -->
<g transform="translate(290,52)">
  <rect x="0" y="0" width="180" height="130" rx="6" fill="#050308" stroke="#4C1D95"/>
  <circle cx="12" cy="12" r="3" fill="#E13838"/>
  <circle cx="22" cy="12" r="3" fill="#A855F7"/>
  <circle cx="32" cy="12" r="3" fill="#C084FC"/>
  <g class="mono" font-size="9">
    <text x="10" y="36" fill="#4C1D95">1</text><text x="24" y="36" fill="#F8FAFC">def </text><text x="52" y="36" fill="#E13838">solve</text><text x="88" y="36" fill="#F8FAFC">(q):</text>
    <text x="10" y="50" fill="#4C1D95">2</text><text x="30" y="50" fill="#A855F7">ctx = </text><text x="68" y="50" fill="#F8FAFC">retrieve(q)</text>
    <text x="10" y="64" fill="#4C1D95">3</text><text x="30" y="64" fill="#A855F7">a = </text><text x="58" y="64" fill="#F8FAFC">gemini(ctx, q)</text>
    <text x="10" y="78" fill="#4C1D95">4</text><text x="30" y="78" fill="#A855F7">b = </text><text x="58" y="78" fill="#F8FAFC">openai(ctx, q)</text>
    <text x="10" y="92" fill="#4C1D95">5</text><text x="30" y="92" fill="#A855F7">return </text><text x="78" y="92" fill="#F8FAFC">merge(a, b)</text>
    <text x="10" y="106" fill="#4C1D95">6</text>
    <text x="10" y="120" fill="#4C1D95">7</text>
  </g>
  <rect x="24" y="99" width="7" height="10" fill="#E13838" class="blink"/>
</g>

<g transform="translate(18,186)">
  <text x="0" y="0" class="mono" font-size="10" letter-spacing="3" fill="#7C3AED">· METRICS ·</text>
  <g transform="translate(0,10)">
    <rect width="148" height="56" rx="8" fill="#140824" stroke="#4C1D95"/>
    <text x="10" y="22" class="mono" font-size="9" fill="#7C3AED">RETRIEVAL</text>
    <text x="10" y="42" class="mono" font-size="10" fill="#F8FAFC">FAISS vector store</text>
  </g>
  <g transform="translate(156,10)">
    <rect width="150" height="56" rx="8" fill="#140824" stroke="#4C1D95"/>
    <text x="10" y="22" class="mono" font-size="9" fill="#7C3AED">MODELS</text>
    <text x="10" y="42" class="mono" font-size="10" fill="#F8FAFC">Gemini + OpenAI</text>
  </g>
  <g transform="translate(314,10)">
    <rect width="150" height="56" rx="8" fill="#140824" stroke="#4C1D95"/>
    <text x="10" y="22" class="mono" font-size="9" fill="#7C3AED">SECURITY</text>
    <text x="10" y="42" class="mono" font-size="10" fill="#E13838">BYO-key · isolated</text>
  </g>
</g>

<text x="472" y="265" text-anchor="end" class="mono" font-size="9" letter-spacing="3" fill="#4C1D95">github.com/Anandtripathiii/CodePilot-AI</text>
</svg>

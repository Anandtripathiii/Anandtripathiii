<svg xmlns="http://www.w3.org/2000/svg" width="490" height="280" viewBox="0 0 490 280" role="img" aria-label="DocMind AI">
<style>
  .mono { font-family: ui-monospace, Menlo, Consolas, monospace; }
  .sans { font-family: -apple-system, 'Segoe UI', Helvetica, sans-serif; }
  .scan { animation: scan 3s linear infinite; }
  @keyframes scan { 0% { transform: translateY(0); opacity: 0; } 15% { opacity: .9; } 100% { transform: translateY(110px); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1a0a2e"/><stop offset="1" stop-color="#050308"/></linearGradient>
  <linearGradient id="brd" x1="0" x2="1"><stop offset="0" stop-color="#A855F7"/><stop offset="1" stop-color="#E13838"/></linearGradient>
</defs>
<rect x="1" y="1" width="488" height="278" rx="14" fill="url(#bg)" stroke="url(#brd)" stroke-width="2"/>

<!-- Top row: chips + project number -->
<g transform="translate(18,16)">
  <rect width="12" height="14" fill="#E13838"/>
  <text x="22" y="12" class="mono" font-size="10" letter-spacing="3" fill="#C084FC">[ 01 ] · DOCMIND-AI</text>
</g>
<g transform="translate(18,42)">
  <rect width="92" height="20" rx="4" fill="#991B1B"/>
  <text x="46" y="14" text-anchor="middle" class="mono" font-size="9" letter-spacing="1.6" fill="#F8FAFC">LIVE · RAG</text>
  <rect x="100" width="126" height="20" rx="4" fill="#1a0a2e" stroke="#4C1D95"/>
  <text x="163" y="14" text-anchor="middle" class="mono" font-size="9" letter-spacing="1.6" fill="#A855F7">FASTAPI · GEMINI</text>
</g>

<!-- Title + blurb -->
<text x="18" y="100" class="sans" font-size="24" font-weight="900" fill="#F8FAFC">DocMind AI</text>
<text x="18" y="124" class="sans" font-size="12" fill="#C084FC">Chat with your documents — every answer</text>
<text x="18" y="140" class="sans" font-size="12" fill="#C084FC">verified line-by-line against the source.</text>

<!-- Doc visual on right -->
<g transform="translate(290,52)">
  <!-- back doc -->
  <rect x="30" y="12" width="110" height="130" rx="4" fill="#A855F7" opacity=".3"/>
  <!-- front doc -->
  <rect x="16" y="4" width="110" height="130" rx="4" fill="#F8FAFC"/>
  <!-- lines -->
  <g fill="#4C1D95" opacity=".55">
    <rect x="26" y="18" width="80" height="4" rx="2"/>
    <rect x="26" y="28" width="90" height="3" rx="1.5"/>
    <rect x="26" y="36" width="70" height="3" rx="1.5"/>
    <rect x="26" y="44" width="88" height="3" rx="1.5"/>
    <rect x="26" y="56" width="60" height="3" rx="1.5"/>
    <rect x="26" y="64" width="90" height="3" rx="1.5"/>
    <rect x="26" y="72" width="78" height="3" rx="1.5"/>
    <rect x="26" y="84" width="90" height="3" rx="1.5"/>
    <rect x="26" y="92" width="55" height="3" rx="1.5"/>
    <rect x="26" y="100" width="80" height="3" rx="1.5"/>
    <rect x="26" y="112" width="70" height="3" rx="1.5"/>
    <rect x="26" y="120" width="85" height="3" rx="1.5"/>
  </g>
  <!-- highlight quote -->
  <rect x="24" y="40" width="82" height="8" fill="#E13838" opacity=".55"/>
  <!-- scan line -->
  <rect x="16" y="4" width="110" height="2" fill="#A855F7" opacity=".85" class="scan"/>
  <!-- verify badge -->
  <circle cx="124" cy="130" r="18" fill="#050308" stroke="#A855F7" stroke-width="2"/>
  <path d="M116 130 l6 6 l12 -12" stroke="#E13838" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</g>

<!-- Metrics row -->
<g transform="translate(18,186)">
  <text x="0" y="0" class="mono" font-size="10" letter-spacing="3" fill="#7C3AED">· METRICS ·</text>
  <g transform="translate(0,10)">
    <rect width="148" height="56" rx="8" fill="#140824" stroke="#4C1D95"/>
    <text x="10" y="22" class="mono" font-size="9" fill="#7C3AED">STACK</text>
    <text x="10" y="42" class="mono" font-size="10" fill="#F8FAFC">Python · FastAPI</text>
  </g>
  <g transform="translate(156,10)">
    <rect width="150" height="56" rx="8" fill="#140824" stroke="#4C1D95"/>
    <text x="10" y="22" class="mono" font-size="9" fill="#7C3AED">RETRIEVAL</text>
    <text x="10" y="42" class="mono" font-size="10" fill="#F8FAFC">per-session isolation</text>
  </g>
  <g transform="translate(314,10)">
    <rect width="150" height="56" rx="8" fill="#140824" stroke="#4C1D95"/>
    <text x="10" y="22" class="mono" font-size="9" fill="#7C3AED">GUARDRAIL</text>
    <text x="10" y="42" class="mono" font-size="10" fill="#E13838">quote-verified</text>
  </g>
</g>

<text x="472" y="265" text-anchor="end" class="mono" font-size="9" letter-spacing="3" fill="#4C1D95">github.com/Anandtripathiii/Docmind-AI</text>
</svg>

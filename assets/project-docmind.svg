<svg xmlns="http://www.w3.org/2000/svg" width="490" height="260" viewBox="0 0 490 260" role="img" aria-label="DocMind AI — source-grounded document Q&amp;A with hallucination control">
<style>
  .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
  .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }
  .scan { animation: scan 3s linear infinite; }
  @keyframes scan { 0% { transform: translateY(-10px); opacity: 0; } 15% { opacity: .9; } 100% { transform: translateY(90px); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<defs>
  <linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#1a0a08"/><stop offset="1" stop-color="#0A0806"/>
  </linearGradient>
  <linearGradient id="brd1" x1="0" x2="1">
    <stop offset="0" stop-color="#DC2626"/><stop offset="1" stop-color="#F5E6C8"/>
  </linearGradient>
  <linearGradient id="doc" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#F5E6C8"/><stop offset="1" stop-color="#C9B48A"/>
  </linearGradient>
</defs>

<rect x="1" y="1" width="488" height="258" rx="14" fill="url(#bg1)" stroke="url(#brd1)" stroke-width="1.4"/>

<!-- Chip row -->
<g transform="translate(18,16)">
  <rect width="92" height="20" rx="6" fill="#991B1B"/>
  <text x="46" y="14" text-anchor="middle" class="mono" font-size="9" letter-spacing="1.6" fill="#F5E6C8">LIVE · RAG</text>
  <rect x="102" width="130" height="20" rx="6" fill="none" stroke="#8a7849"/>
  <text x="167" y="14" text-anchor="middle" class="mono" font-size="9" letter-spacing="1.6" fill="#C9B48A">FASTAPI · GEMINI</text>
</g>

<!-- Title + blurb -->
<text x="18" y="68" class="sans" font-size="22" font-weight="800" fill="#F5E6C8">DocMind AI</text>
<text x="18" y="92" class="sans" font-size="12" fill="#C9B48A">Chat with your documents — every answer</text>
<text x="18" y="108" class="sans" font-size="12" fill="#C9B48A">verified line-by-line against the source.</text>

<!-- Doc visual on right -->
<g transform="translate(300,54)">
  <!-- back doc -->
  <rect x="36" y="12" width="110" height="130" rx="4" fill="#8a7849" opacity=".5"/>
  <!-- front doc -->
  <rect x="20" y="2" width="110" height="130" rx="4" fill="url(#doc)"/>
  <!-- lines -->
  <g fill="#5a1414" opacity=".55">
    <rect x="30" y="16" width="80" height="4" rx="2"/>
    <rect x="30" y="26" width="90" height="3" rx="1.5"/>
    <rect x="30" y="34" width="70" height="3" rx="1.5"/>
    <rect x="30" y="42" width="88" height="3" rx="1.5"/>
    <rect x="30" y="54" width="60" height="3" rx="1.5"/>
    <rect x="30" y="62" width="90" height="3" rx="1.5"/>
    <rect x="30" y="70" width="78" height="3" rx="1.5"/>
    <rect x="30" y="82" width="90" height="3" rx="1.5"/>
    <rect x="30" y="90" width="55" height="3" rx="1.5"/>
    <rect x="30" y="98" width="80" height="3" rx="1.5"/>
    <rect x="30" y="110" width="70" height="3" rx="1.5"/>
    <rect x="30" y="118" width="85" height="3" rx="1.5"/>
  </g>
  <!-- highlight quote -->
  <rect x="28" y="40" width="82" height="7" fill="#DC2626" opacity=".35"/>
  <!-- scan line -->
  <rect x="20" y="2" width="110" height="2" fill="#DC2626" opacity=".8" class="scan"/>
  <!-- verify checkmark -->
  <circle cx="128" cy="130" r="18" fill="#0A0806" stroke="#DC2626" stroke-width="2"/>
  <path d="M120 130 l6 6 l12 -12" stroke="#F5E6C8" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</g>

<!-- Metrics row -->
<g transform="translate(18,170)">
  <text x="0" y="0" class="mono" font-size="10" letter-spacing="3" fill="#8a7849">METRICS</text>
  <g transform="translate(0,10)">
    <rect width="148" height="56" rx="8" fill="#140807" stroke="#3f1515"/>
    <text x="10" y="22" class="mono" font-size="9" fill="#8a7849">STACK</text>
    <text x="10" y="42" class="mono" font-size="10" fill="#F5E6C8">Python · FastAPI · Gemini</text>
  </g>
  <g transform="translate(156,10)">
    <rect width="150" height="56" rx="8" fill="#140807" stroke="#3f1515"/>
    <text x="10" y="22" class="mono" font-size="9" fill="#8a7849">RETRIEVAL</text>
    <text x="10" y="42" class="mono" font-size="10" fill="#F5E6C8">per-session isolation</text>
  </g>
  <g transform="translate(314,10)">
    <rect width="150" height="56" rx="8" fill="#140807" stroke="#3f1515"/>
    <text x="10" y="22" class="mono" font-size="9" fill="#8a7849">GUARDRAIL</text>
    <text x="10" y="42" class="mono" font-size="10" fill="#DC2626">quote-verified answers</text>
  </g>
</g>

<!-- footer tag -->
<text x="18" y="245" class="mono" font-size="10" letter-spacing="3" fill="#C9B48A">→ Docmind-AI</text>
<text x="472" y="245" text-anchor="end" class="mono" font-size="10" letter-spacing="3" fill="#8a7849">github.com/Anandtripathiii</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="490" height="300" viewBox="0 0 490 300" role="img" aria-label="Export-Automation">
<style>
  .mono { font-family: ui-monospace, Menlo, Consolas, monospace; }
  .sans { font-family: -apple-system, 'Segoe UI', Helvetica, sans-serif; }
  .fly { animation: fly 4s ease-in-out infinite; }
  @keyframes fly { 0%,100% { transform:translate(0,0); } 50% { transform:translate(8px,-5px); } }
  @media (prefers-reduced-motion: reduce) { * { animation:none !important; } }
</style>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1a0a2e"/><stop offset="1" stop-color="#050308"/></linearGradient>
</defs>

<rect x="2" y="2" width="486" height="296" rx="14" fill="url(#bg)"/>
<rect x="2" y="2" width="486" height="296" rx="14" fill="none" stroke="#4C1D95" stroke-width="1.2"/>
<rect x="2" y="2" width="486" height="296" rx="14" fill="none" stroke="#E13838" stroke-width="2" stroke-dasharray="18 10">
  <animate attributeName="stroke-dashoffset" from="0" to="-28" dur="2s" repeatCount="indefinite"/>
</rect>

<g transform="translate(18,16)">
  <rect width="12" height="14" fill="#A855F7"/>
  <text x="22" y="12" class="mono" font-size="10" letter-spacing="3" fill="#C084FC">[ 04 ] · EXPORT-AUTOMATION</text>
</g>
<g transform="translate(18,42)">
  <rect width="132" height="20" rx="4" fill="#991B1B"/>
  <text x="66" y="14" text-anchor="middle" class="mono" font-size="9" letter-spacing="1.6" fill="#F8FAFC">AUTOMATION · AI</text>
  <rect x="140" width="120" height="20" rx="4" fill="#1a0a2e" stroke="#4C1D95"/>
  <text x="200" y="14" text-anchor="middle" class="mono" font-size="9" letter-spacing="1.6" fill="#A855F7">FLASK · GEMINI</text>
</g>

<text x="18" y="104" class="sans" font-size="24" font-weight="900" fill="#F8FAFC">Export-Automation</text>
<text x="18" y="128" class="sans" font-size="12" fill="#C084FC">Scrapes leads, validates emails, drafts</text>
<text x="18" y="144" class="sans" font-size="12" fill="#C084FC">and sends outreach — all from one input.</text>

<g transform="translate(300,66)">
  <g class="fly">
    <rect x="20" y="10" width="130" height="80" rx="6" fill="#F8FAFC" stroke="#4C1D95"/>
    <path d="M20 10 L85 60 L150 10" fill="none" stroke="#A855F7" stroke-width="2"/>
    <circle cx="150" cy="12" r="18" fill="#E13838"/>
    <text x="150" y="18" text-anchor="middle" class="sans" font-size="18" font-weight="800" fill="#F8FAFC">→</text>
    <rect x="30" y="76" width="60" height="4" fill="#A855F7" opacity=".6"/>
  </g>
</g>

<g transform="translate(18,200)">
  <text x="0" y="0" class="mono" font-size="10" letter-spacing="3" fill="#7C3AED">· METRICS ·</text>
  <g transform="translate(0,10)">
    <rect width="148" height="56" rx="8" fill="#140824" stroke="#4C1D95"/>
    <text x="10" y="22" class="mono" font-size="9" fill="#7C3AED">INPUT</text>
    <text x="10" y="42" class="mono" font-size="10" fill="#F8FAFC">product + country</text>
  </g>
  <g transform="translate(156,10)">
    <rect width="150" height="56" rx="8" fill="#140824" stroke="#4C1D95"/>
    <text x="10" y="22" class="mono" font-size="9" fill="#7C3AED">PIPELINE</text>
    <text x="10" y="42" class="mono" font-size="10" fill="#F8FAFC">scrape → verify → send</text>
  </g>
  <g transform="translate(314,10)">
    <rect width="150" height="56" rx="8" fill="#140824" stroke="#4C1D95"/>
    <text x="10" y="22" class="mono" font-size="9" fill="#7C3AED">INTELLIGENCE</text>
    <text x="10" y="42" class="mono" font-size="10" fill="#E13838">Gemini classifier</text>
  </g>
</g>

<text x="472" y="285" text-anchor="end" class="mono" font-size="9" letter-spacing="3" fill="#4C1D95">github.com/Anandtripathiii/Export-Automation</text>
</svg>

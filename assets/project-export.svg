<svg xmlns="http://www.w3.org/2000/svg" width="490" height="260" viewBox="0 0 490 260" role="img" aria-label="Export-Automation — automated outreach pipeline">
<style>
  .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
  .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }
  .fly { animation: fly 4s ease-in-out infinite; transform-origin: center; }
  @keyframes fly { 0%,100% { transform: translate(0,0); } 50% { transform: translate(10px,-6px); } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<defs>
  <linearGradient id="bg4" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#1a0a08"/><stop offset="1" stop-color="#0A0806"/>
  </linearGradient>
  <linearGradient id="brd4" x1="0" x2="1">
    <stop offset="0" stop-color="#F5E6C8"/><stop offset="1" stop-color="#DC2626"/>
  </linearGradient>
</defs>

<rect x="1" y="1" width="488" height="258" rx="14" fill="url(#bg4)" stroke="url(#brd4)" stroke-width="1.4"/>

<!-- Chip row -->
<g transform="translate(18,16)">
  <rect width="128" height="20" rx="6" fill="#991B1B"/>
  <text x="64" y="14" text-anchor="middle" class="mono" font-size="9" letter-spacing="1.6" fill="#F5E6C8">AUTOMATION · AI</text>
  <rect x="138" width="118" height="20" rx="6" fill="none" stroke="#8a7849"/>
  <text x="197" y="14" text-anchor="middle" class="mono" font-size="9" letter-spacing="1.6" fill="#C9B48A">FLASK · GEMINI</text>
</g>

<!-- Title + blurb -->
<text x="18" y="68" class="sans" font-size="22" font-weight="800" fill="#F5E6C8">Export-Automation</text>
<text x="18" y="92" class="sans" font-size="12" fill="#C9B48A">Web-scrapes leads, validates emails, drafts</text>
<text x="18" y="108" class="sans" font-size="12" fill="#C9B48A">and sends outreach — hands-off from one input.</text>

<!-- Envelope visual on right -->
<g transform="translate(300,54)">
  <g class="fly">
    <rect x="20" y="10" width="130" height="80" rx="6" fill="#F5E6C8" stroke="#8a7849"/>
    <path d="M20 10 L85 60 L150 10" fill="none" stroke="#DC2626" stroke-width="2"/>
    <circle cx="150" cy="12" r="18" fill="#DC2626"/>
    <text x="150" y="18" text-anchor="middle" class="sans" font-size="18" font-weight="800" fill="#F5E6C8">→</text>
    <!-- stamp line -->
    <rect x="30" y="76" width="60" height="4" fill="#991B1B" opacity=".6"/>
  </g>
</g>

<!-- Metrics row -->
<g transform="translate(18,170)">
  <text x="0" y="0" class="mono" font-size="10" letter-spacing="3" fill="#8a7849">METRICS</text>
  <g transform="translate(0,10)">
    <rect width="148" height="56" rx="8" fill="#140807" stroke="#3f1515"/>
    <text x="10" y="22" class="mono" font-size="9" fill="#8a7849">INPUT</text>
    <text x="10" y="42" class="mono" font-size="10" fill="#F5E6C8">product + country</text>
  </g>
  <g transform="translate(156,10)">
    <rect width="150" height="56" rx="8" fill="#140807" stroke="#3f1515"/>
    <text x="10" y="22" class="mono" font-size="9" fill="#8a7849">PIPELINE</text>
    <text x="10" y="42" class="mono" font-size="10" fill="#F5E6C8">scrape → verify → send</text>
  </g>
  <g transform="translate(314,10)">
    <rect width="150" height="56" rx="8" fill="#140807" stroke="#3f1515"/>
    <text x="10" y="22" class="mono" font-size="9" fill="#8a7849">INTELLIGENCE</text>
    <text x="10" y="42" class="mono" font-size="10" fill="#DC2626">Gemini classification</text>
  </g>
</g>

<!-- footer tag -->
<text x="18" y="245" class="mono" font-size="10" letter-spacing="3" fill="#C9B48A">→ Export-Automation</text>
<text x="472" y="245" text-anchor="end" class="mono" font-size="10" letter-spacing="3" fill="#8a7849">github.com/Anandtripathiii</text>
</svg>

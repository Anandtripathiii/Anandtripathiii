<svg xmlns="http://www.w3.org/2000/svg" width="490" height="300" viewBox="0 0 490 300" role="img" aria-label="FleetFlow">
<style>
  .mono { font-family: ui-monospace, Menlo, Consolas, monospace; }
  .sans { font-family: -apple-system, 'Segoe UI', Helvetica, sans-serif; }
  .drive { animation: drive 4s linear infinite; }
  @keyframes drive { 0% { transform:translateX(-20px); } 100% { transform:translateX(140px); } }
  @media (prefers-reduced-motion: reduce) { * { animation:none !important; } }
</style>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1a0a2e"/><stop offset="1" stop-color="#050308"/></linearGradient>
</defs>

<rect x="2" y="2" width="486" height="296" rx="14" fill="url(#bg)"/>
<rect x="2" y="2" width="486" height="296" rx="14" fill="none" stroke="#4C1D95" stroke-width="1.2"/>
<rect x="2" y="2" width="486" height="296" rx="14" fill="none" stroke="#A855F7" stroke-width="2" stroke-dasharray="18 10">
  <animate attributeName="stroke-dashoffset" from="0" to="-28" dur="2s" repeatCount="indefinite"/>
</rect>

<g transform="translate(18,16)">
  <rect width="12" height="14" fill="#E13838"/>
  <text x="22" y="12" class="mono" font-size="10" letter-spacing="3" fill="#C084FC">[ 05 ] · FLEETFLOW</text>
</g>
<g transform="translate(18,42)">
  <rect width="110" height="20" rx="4" fill="#991B1B"/>
  <text x="55" y="14" text-anchor="middle" class="mono" font-size="9" letter-spacing="1.6" fill="#F8FAFC">LIVE · RENDER</text>
  <rect x="136" width="140" height="20" rx="4" fill="#1a0a2e" stroke="#4C1D95"/>
  <text x="206" y="14" text-anchor="middle" class="mono" font-size="9" letter-spacing="1.6" fill="#A855F7">IGNITE · ROUND 2</text>
</g>

<text x="18" y="104" class="sans" font-size="24" font-weight="900" fill="#F8FAFC">FleetFlow</text>
<text x="18" y="128" class="sans" font-size="12" fill="#C084FC">Web product in the IGNITE competition —</text>
<text x="18" y="144" class="sans" font-size="12" fill="#C084FC">live on Render, now in Round 2.</text>

<g transform="translate(290,70)">
  <rect x="0" y="60" width="180" height="30" rx="4" fill="#140824" stroke="#4C1D95"/>
  <g fill="#A855F7">
    <rect x="16" y="72" width="20" height="4"/>
    <rect x="56" y="72" width="20" height="4"/>
    <rect x="96" y="72" width="20" height="4"/>
    <rect x="136" y="72" width="20" height="4"/>
  </g>
  <g class="drive">
    <g fill="#E13838"><rect x="0" y="36" width="24" height="22"/></g>
    <g fill="#F8FAFC"><rect x="24" y="26" width="36" height="32" stroke="#C084FC"/></g>
    <rect x="4" y="40" width="12" height="8" fill="#C084FC"/>
    <g fill="#050308">
      <rect x="4"  y="56" width="8" height="6"/>
      <rect x="28" y="56" width="8" height="6"/>
      <rect x="46" y="56" width="8" height="6"/>
    </g>
  </g>
  <g transform="translate(160,22)" fill="#A855F7">
    <rect x="0" y="0" width="10" height="4"/>
    <rect x="-2" y="4" width="14" height="10"/>
    <rect x="4" y="14" width="2" height="6"/>
    <rect x="3" y="6" width="4" height="4" fill="#F8FAFC"/>
  </g>
</g>

<g transform="translate(18,200)">
  <text x="0" y="0" class="mono" font-size="10" letter-spacing="3" fill="#7C3AED">· METRICS ·</text>
  <g transform="translate(0,10)">
    <rect width="148" height="56" rx="8" fill="#140824" stroke="#4C1D95"/>
    <text x="10" y="22" class="mono" font-size="9" fill="#7C3AED">STATUS</text>
    <text x="10" y="42" class="mono" font-size="10" fill="#F8FAFC">live on Render</text>
  </g>
  <g transform="translate(156,10)">
    <rect width="150" height="56" rx="8" fill="#140824" stroke="#4C1D95"/>
    <text x="10" y="22" class="mono" font-size="9" fill="#7C3AED">COMPETITION</text>
    <text x="10" y="42" class="mono" font-size="10" fill="#F8FAFC">IGNITE Round 2</text>
  </g>
  <g transform="translate(314,10)">
    <rect width="150" height="56" rx="8" fill="#140824" stroke="#4C1D95"/>
    <text x="10" y="22" class="mono" font-size="9" fill="#7C3AED">ALSO AT</text>
    <text x="10" y="42" class="mono" font-size="10" fill="#E13838">Prompt-ae-thon '26</text>
  </g>
</g>

<text x="472" y="285" text-anchor="end" class="mono" font-size="9" letter-spacing="3" fill="#4C1D95">fleetflow-8x7h.onrender.com</text>
</svg>

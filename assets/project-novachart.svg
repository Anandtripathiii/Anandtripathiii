<svg xmlns="http://www.w3.org/2000/svg" width="490" height="260" viewBox="0 0 490 260" role="img" aria-label="NovaChart SupportAI — prompt-engineered customer support engine">
<style>
  .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
  .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }
  .pulse { animation: pulse 2s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<defs>
  <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#1a0a08"/><stop offset="1" stop-color="#0A0806"/>
  </linearGradient>
  <linearGradient id="brd3" x1="0" x2="1">
    <stop offset="0" stop-color="#DC2626"/><stop offset="1" stop-color="#F5E6C8"/>
  </linearGradient>
</defs>

<rect x="1" y="1" width="488" height="258" rx="14" fill="url(#bg3)" stroke="url(#brd3)" stroke-width="1.4"/>

<!-- Chip row -->
<g transform="translate(18,16)">
  <rect width="140" height="20" rx="6" fill="#991B1B"/>
  <text x="70" y="14" text-anchor="middle" class="mono" font-size="9" letter-spacing="1.6" fill="#F5E6C8">5-STAGE PIPELINE</text>
  <rect x="150" width="92" height="20" rx="6" fill="none" stroke="#8a7849"/>
  <text x="196" y="14" text-anchor="middle" class="mono" font-size="9" letter-spacing="1.6" fill="#C9B48A">STREAMLIT</text>
</g>

<!-- Title + blurb -->
<text x="18" y="68" class="sans" font-size="22" font-weight="800" fill="#F5E6C8">NovaChart SupportAI</text>
<text x="18" y="92" class="sans" font-size="12" fill="#C9B48A">Classifies, resolves, escalates — prompt</text>
<text x="18" y="108" class="sans" font-size="12" fill="#C9B48A">engineering treated as a measurable pipeline.</text>

<!-- Pipeline visual -->
<g transform="translate(285,66)">
  <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="9" fill="#F5E6C8">
    <circle cx="12" cy="12" r="10" fill="#DC2626"/><text x="12" y="16" text-anchor="middle">1</text>
    <line x1="22" y1="12" x2="40" y2="12" stroke="#8a7849" stroke-dasharray="2 2"/>
    <circle cx="52" cy="12" r="10" fill="#B91C1C"/><text x="52" y="16" text-anchor="middle">2</text>
    <line x1="62" y1="12" x2="80" y2="12" stroke="#8a7849" stroke-dasharray="2 2"/>
    <circle cx="92" cy="12" r="10" fill="#991B1B"/><text x="92" y="16" text-anchor="middle">3</text>
    <line x1="102" y1="12" x2="120" y2="12" stroke="#8a7849" stroke-dasharray="2 2"/>
    <circle cx="132" cy="12" r="10" fill="#C9B48A" class="pulse"/><text x="132" y="16" text-anchor="middle" fill="#1a0a08">4</text>
    <line x1="142" y1="12" x2="160" y2="12" stroke="#8a7849" stroke-dasharray="2 2"/>
    <circle cx="172" cy="12" r="10" fill="#F5E6C8"/><text x="172" y="16" text-anchor="middle" fill="#1a0a08">5</text>
  </g>
  <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="8" fill="#8a7849">
    <text x="12" y="36" text-anchor="middle">intake</text>
    <text x="52" y="36" text-anchor="middle">classify</text>
    <text x="92" y="36" text-anchor="middle">resolve</text>
    <text x="132" y="36" text-anchor="middle">score</text>
    <text x="172" y="36" text-anchor="middle">route</text>
  </g>
  <!-- confidence meter -->
  <g transform="translate(0,60)">
    <text class="mono" font-size="9" fill="#8a7849" x="0" y="0">CONFIDENCE</text>
    <rect x="0" y="6" width="184" height="8" rx="4" fill="#1a0a08" stroke="#3f1515"/>
    <rect x="0" y="6" width="140" height="8" rx="4" fill="#DC2626"/>
    <text class="mono" font-size="9" fill="#F5E6C8" x="184" y="13" text-anchor="end">76%</text>
  </g>
</g>

<!-- Metrics row -->
<g transform="translate(18,170)">
  <text x="0" y="0" class="mono" font-size="10" letter-spacing="3" fill="#8a7849">METRICS</text>
  <g transform="translate(0,10)">
    <rect width="148" height="56" rx="8" fill="#140807" stroke="#3f1515"/>
    <text x="10" y="22" class="mono" font-size="9" fill="#8a7849">SCOPE</text>
    <text x="10" y="42" class="mono" font-size="10" fill="#F5E6C8">8 support scenarios</text>
  </g>
  <g transform="translate(156,10)">
    <rect width="150" height="56" rx="8" fill="#140807" stroke="#3f1515"/>
    <text x="10" y="22" class="mono" font-size="9" fill="#8a7849">BENCHMARK</text>
    <text x="10" y="42" class="mono" font-size="10" fill="#F5E6C8">basic · few-shot · chain</text>
  </g>
  <g transform="translate(314,10)">
    <rect width="150" height="56" rx="8" fill="#140807" stroke="#3f1515"/>
    <text x="10" y="22" class="mono" font-size="9" fill="#8a7849">SAFETY</text>
    <text x="10" y="42" class="mono" font-size="10" fill="#DC2626">human-escalation</text>
  </g>
</g>

<!-- footer tag -->
<text x="18" y="245" class="mono" font-size="10" letter-spacing="3" fill="#C9B48A">→ NovaChart-SupportAI</text>
<text x="472" y="245" text-anchor="end" class="mono" font-size="10" letter-spacing="3" fill="#8a7849">github.com/Anandtripathiii</text>
</svg>

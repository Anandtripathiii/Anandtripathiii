<svg xmlns="http://www.w3.org/2000/svg" width="490" height="280" viewBox="0 0 490 280" role="img" aria-label="NovaChart SupportAI">
<style>
  .mono { font-family: ui-monospace, Menlo, Consolas, monospace; }
  .sans { font-family: -apple-system, 'Segoe UI', Helvetica, sans-serif; }
  .pulse { animation: pulse 2s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity:.35; } 50% { opacity:1; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1a0a2e"/><stop offset="1" stop-color="#050308"/></linearGradient>
  <linearGradient id="brd" x1="0" x2="1"><stop offset="0" stop-color="#A855F7"/><stop offset="1" stop-color="#E13838"/></linearGradient>
</defs>
<rect x="1" y="1" width="488" height="278" rx="14" fill="url(#bg)" stroke="url(#brd)" stroke-width="2"/>

<g transform="translate(18,16)">
  <rect width="12" height="14" fill="#E13838"/>
  <text x="22" y="12" class="mono" font-size="10" letter-spacing="3" fill="#C084FC">[ 03 ] · NOVACHART-SUPPORTAI</text>
</g>
<g transform="translate(18,42)">
  <rect width="146" height="20" rx="4" fill="#991B1B"/>
  <text x="73" y="14" text-anchor="middle" class="mono" font-size="9" letter-spacing="1.6" fill="#F8FAFC">5-STAGE PIPELINE</text>
  <rect x="154" width="92" height="20" rx="4" fill="#1a0a2e" stroke="#4C1D95"/>
  <text x="200" y="14" text-anchor="middle" class="mono" font-size="9" letter-spacing="1.6" fill="#A855F7">STREAMLIT</text>
</g>

<text x="18" y="100" class="sans" font-size="24" font-weight="900" fill="#F8FAFC">NovaChart SupportAI</text>
<text x="18" y="124" class="sans" font-size="12" fill="#C084FC">Classifies, resolves, escalates — prompt</text>
<text x="18" y="140" class="sans" font-size="12" fill="#C084FC">engineering as a measurable pipeline.</text>

<!-- Pipeline visual -->
<g transform="translate(285,80)">
  <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="9" fill="#F8FAFC">
    <circle cx="12" cy="12" r="10" fill="#E13838"/><text x="12" y="16" text-anchor="middle">1</text>
    <line x1="22" y1="12" x2="40" y2="12" stroke="#4C1D95" stroke-dasharray="2 2"/>
    <circle cx="52" cy="12" r="10" fill="#B91C1C"/><text x="52" y="16" text-anchor="middle">2</text>
    <line x1="62" y1="12" x2="80" y2="12" stroke="#4C1D95" stroke-dasharray="2 2"/>
    <circle cx="92" cy="12" r="10" fill="#991B1B"/><text x="92" y="16" text-anchor="middle">3</text>
    <line x1="102" y1="12" x2="120" y2="12" stroke="#4C1D95" stroke-dasharray="2 2"/>
    <circle cx="132" cy="12" r="10" fill="#A855F7" class="pulse"/><text x="132" y="16" text-anchor="middle" fill="#0A0612">4</text>
    <line x1="142" y1="12" x2="160" y2="12" stroke="#4C1D95" stroke-dasharray="2 2"/>
    <circle cx="172" cy="12" r="10" fill="#C084FC"/><text x="172" y="16" text-anchor="middle" fill="#0A0612">5</text>
  </g>
  <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="8" fill="#7C3AED">
    <text x="12" y="36" text-anchor="middle">intake</text>
    <text x="52" y="36" text-anchor="middle">classify</text>
    <text x="92" y="36" text-anchor="middle">resolve</text>
    <text x="132" y="36" text-anchor="middle">score</text>
    <text x="172" y="36" text-anchor="middle">route</text>
  </g>
  <g transform="translate(0,60)">
    <text class="mono" font-size="9" fill="#7C3AED" x="0" y="0">CONFIDENCE</text>
    <rect x="0" y="6" width="184" height="8" rx="4" fill="#1a0a2e" stroke="#4C1D95"/>
    <rect x="0" y="6" width="140" height="8" rx="4" fill="#E13838"/>
    <text class="mono" font-size="9" fill="#F8FAFC" x="184" y="13" text-anchor="end">76%</text>
  </g>
</g>

<g transform="translate(18,186)">
  <text x="0" y="0" class="mono" font-size="10" letter-spacing="3" fill="#7C3AED">· METRICS ·</text>
  <g transform="translate(0,10)">
    <rect width="148" height="56" rx="8" fill="#140824" stroke="#4C1D95"/>
    <text x="10" y="22" class="mono" font-size="9" fill="#7C3AED">SCOPE</text>
    <text x="10" y="42" class="mono" font-size="10" fill="#F8FAFC">8 support scenarios</text>
  </g>
  <g transform="translate(156,10)">
    <rect width="150" height="56" rx="8" fill="#140824" stroke="#4C1D95"/>
    <text x="10" y="22" class="mono" font-size="9" fill="#7C3AED">BENCHMARK</text>
    <text x="10" y="42" class="mono" font-size="10" fill="#F8FAFC">basic · few-shot · chain</text>
  </g>
  <g transform="translate(314,10)">
    <rect width="150" height="56" rx="8" fill="#140824" stroke="#4C1D95"/>
    <text x="10" y="22" class="mono" font-size="9" fill="#7C3AED">SAFETY</text>
    <text x="10" y="42" class="mono" font-size="10" fill="#E13838">human-escalation</text>
  </g>
</g>

<text x="472" y="265" text-anchor="end" class="mono" font-size="9" letter-spacing="3" fill="#4C1D95">github.com/Anandtripathiii/NovaChart-SupportAI</text>
</svg>

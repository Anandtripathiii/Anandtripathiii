<svg xmlns="http://www.w3.org/2000/svg" width="490" height="280" viewBox="0 0 490 280" role="img" aria-label="SafeHer AI">
<style>
  .mono { font-family: ui-monospace, Menlo, Consolas, monospace; }
  .sans { font-family: -apple-system, 'Segoe UI', Helvetica, sans-serif; }
  .pulse { animation: pulse 2s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity:.4; } 50% { opacity:1; } }
  @media (prefers-reduced-motion: reduce) { * { animation:none !important; } }
</style>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1a0a2e"/><stop offset="1" stop-color="#050308"/></linearGradient>
  <linearGradient id="brd" x1="0" x2="1"><stop offset="0" stop-color="#A855F7"/><stop offset="1" stop-color="#E13838"/></linearGradient>
</defs>
<rect x="1" y="1" width="488" height="278" rx="14" fill="url(#bg)" stroke="url(#brd)" stroke-width="2"/>

<g transform="translate(18,16)">
  <rect width="12" height="14" fill="#E13838"/>
  <text x="22" y="12" class="mono" font-size="10" letter-spacing="3" fill="#C084FC">[ 07 ] · SAFHER-AI</text>
</g>
<g transform="translate(18,42)">
  <rect width="128" height="20" rx="4" fill="#991B1B"/>
  <text x="64" y="14" text-anchor="middle" class="mono" font-size="9" letter-spacing="1.6" fill="#F8FAFC">WOMEN · SAFETY</text>
  <rect x="156" width="122" height="20" rx="4" fill="#1a0a2e" stroke="#4C1D95"/>
  <text x="217" y="14" text-anchor="middle" class="mono" font-size="9" letter-spacing="1.6" fill="#A855F7">PS 4 · HACKATHON</text>
</g>

<text x="18" y="100" class="sans" font-size="24" font-weight="900" fill="#F8FAFC">SafeHer AI</text>
<text x="18" y="124" class="sans" font-size="12" fill="#C084FC">AI-powered women's safety web app</text>
<text x="18" y="140" class="sans" font-size="12" fill="#C084FC">with in-app assistant Malenia.</text>

<!-- Shield + heart visual -->
<g transform="translate(305,56)">
  <!-- shield outline -->
  <g fill="#F8FAFC" stroke="#A855F7" stroke-width="2">
    <path d="M80 10 L130 25 L130 70 Q130 110 80 130 Q30 110 30 70 L30 25 Z"/>
  </g>
  <!-- shield gradient fill -->
  <g fill="#E13838" opacity=".55">
    <path d="M80 20 L120 32 L120 70 Q120 100 80 118 Q40 100 40 70 L40 32 Z"/>
  </g>
  <!-- heart in shield -->
  <g transform="translate(70,55)" fill="#F8FAFC">
    <path d="M10 20 Q0 10 0 5 Q0 0 5 0 Q8 0 10 4 Q12 0 15 0 Q20 0 20 5 Q20 10 10 20 Z"/>
  </g>
  <!-- pulse rings -->
  <circle cx="80" cy="70" r="60" fill="none" stroke="#A855F7" stroke-width="1" opacity=".4" class="pulse"/>
</g>

<g transform="translate(18,186)">
  <text x="0" y="0" class="mono" font-size="10" letter-spacing="3" fill="#7C3AED">· METRICS ·</text>
  <g transform="translate(0,10)">
    <rect width="148" height="56" rx="8" fill="#140824" stroke="#4C1D95"/>
    <text x="10" y="22" class="mono" font-size="9" fill="#7C3AED">AI ASSISTANT</text>
    <text x="10" y="42" class="mono" font-size="10" fill="#F8FAFC">Malenia · in-app</text>
  </g>
  <g transform="translate(156,10)">
    <rect width="150" height="56" rx="8" fill="#140824" stroke="#4C1D95"/>
    <text x="10" y="22" class="mono" font-size="9" fill="#7C3AED">DATA</text>
    <text x="10" y="42" class="mono" font-size="10" fill="#F8FAFC">synthetic demo set</text>
  </g>
  <g transform="translate(314,10)">
    <rect width="150" height="56" rx="8" fill="#140824" stroke="#4C1D95"/>
    <text x="10" y="22" class="mono" font-size="9" fill="#7C3AED">DEPLOY</text>
    <text x="10" y="42" class="mono" font-size="10" fill="#E13838">Vercel · live</text>
  </g>
</g>

<text x="472" y="265" text-anchor="end" class="mono" font-size="9" letter-spacing="3" fill="#4C1D95">safher-ai.vercel.app</text>
</svg>

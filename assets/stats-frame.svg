<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="100" viewBox="0 0 1000 100" role="img" aria-label="Stats Deck header">
<style>
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .sans { font-family: -apple-system, 'Segoe UI', Helvetica, sans-serif; }
  .pulse { animation: pulse 2s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity:.55; } 50% { opacity:1; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<defs>
  <linearGradient id="hbg" x1="0" x2="1">
    <stop offset="0" stop-color="#050308"/><stop offset=".5" stop-color="#1a0a2e"/><stop offset="1" stop-color="#050308"/>
  </linearGradient>
  <linearGradient id="hline" x1="0" x2="1">
    <stop offset="0" stop-color="#A855F7" stop-opacity="0"/>
    <stop offset=".5" stop-color="#A855F7"/>
    <stop offset="1" stop-color="#E13838" stop-opacity="0"/>
  </linearGradient>
</defs>
<rect width="1000" height="100" rx="14" fill="url(#hbg)" stroke="#4C1D95"/>
<line x1="40" y1="50" x2="340" y2="50" stroke="url(#hline)" stroke-width="1"/>
<line x1="660" y1="50" x2="960" y2="50" stroke="url(#hline)" stroke-width="1"/>
<g transform="translate(500,32)">
  <text text-anchor="middle" x="0" y="0" class="mono" font-size="10" letter-spacing="4" fill="#C084FC">[ 05 ]</text>
  <text text-anchor="middle" x="0" y="26" class="sans" font-size="22" font-weight="800" letter-spacing="6" fill="#F8FAFC">STATS DECK</text>
  <text text-anchor="middle" x="0" y="48" class="mono" font-size="9" letter-spacing="4" fill="#7C3AED">commits · streaks · languages · snake</text>
</g>
<circle cx="40" cy="50" r="4" fill="#E13838" class="pulse"/>
<circle cx="960" cy="50" r="4" fill="#A855F7" class="pulse"/>
</svg>
